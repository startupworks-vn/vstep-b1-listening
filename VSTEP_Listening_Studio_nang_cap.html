tbody>\u003c/table>\u003c/div>\n\u003ch3>Cộng đồng và tình nguyện\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cụm từ\u003c/th>\u003cth>Nghĩa trong ngữ cảnh\u003c/th>\u003cth>Diễn giải tiếng Anh\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>volunteer support\u003c/td>\u003ctd>sự hỗ trợ của tình nguyện viên\u003c/td>\u003ctd>help from unpaid participants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>local residents\u003c/td>\u003ctd>cư dân địa phương\u003c/td>\u003ctd>people living nearby\u003c/td>\u003c/tr>\u003ctr>\u003ctd>take part in\u003c/td>\u003ctd>tham gia\u003c/td>\u003ctd>participate in\u003c/td>\u003c/tr>\u003ctr>\u003ctd>share skills\u003c/td>\u003ctd>chia sẻ kỹ năng\u003c/td>\u003ctd>help others learn practical abilities\u003c/td>\u003c/tr>\u003ctr>\u003ctd>provide equipment\u003c/td>\u003ctd>cung cấp thiết bị\u003c/td>\u003ctd>supply necessary tools\u003c/td>\u003c/tr>\u003ctr>\u003ctd>bring your own\u003c/td>\u003ctd>tự mang đồ của mình\u003c/td>\u003ctd>supply the item yourself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a waiting list\u003c/td>\u003ctd>danh sách chờ\u003c/td>\u003ctd>a list of people waiting for a place\u003c/td>\u003c/tr>\u003ctr>\u003ctd>run a session\u003c/td>\u003ctd>tổ chức buổi hoạt động\u003c/td>\u003ctd>lead an organised activity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>give feedback\u003c/td>\u003ctd>đưa phản hồi\u003c/td>\u003ctd>share comments on an experience\u003c/td>\u003c/tr>\u003ctr>\u003ctd>follow up\u003c/td>\u003ctd>theo dõi tiếp\u003c/td>\u003ctd>take further action afterwards\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Bảo tàng và phỏng vấn\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cụm từ\u003c/th>\u003cth>Nghĩa trong ngữ cảnh\u003c/th>\u003cth>Diễn giải tiếng Anh\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>a permanent collection\u003c/td>\u003ctd>bộ sưu tập thường trực\u003c/td>\u003ctd>a collection displayed long term\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a temporary exhibition\u003c/td>\u003ctd>triển lãm tạm thời\u003c/td>\u003ctd>a display for a limited period\u003c/td>\u003c/tr>\u003ctr>\u003ctd>an artifact\u003c/td>\u003ctd>hiện vật\u003c/td>\u003ctd>an object made or used by people\u003c/td>\u003c/tr>\u003ctr>\u003ctd>catch your eye\u003c/td>\u003ctd>thu hút sự chú ý\u003c/td>\u003ctd>attract your attention\u003c/td>\u003c/tr>\u003ctr>\u003ctd>record an interview\u003c/td>\u003ctd>ghi âm phỏng vấn\u003c/td>\u003ctd>make a recording of a conversation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>give permission\u003c/td>\u003ctd>cho phép\u003c/td>\u003ctd>consent to an action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>an archive\u003c/td>\u003ctd>kho lưu trữ\u003c/td>\u003ctd>a collection of preserved records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a short extract\u003c/td>\u003ctd>đoạn trích ngắn\u003c/td>\u003ctd>a brief selected part\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a different perspective\u003c/td>\u003ctd>góc nhìn khác\u003c/td>\u003ctd>another way of seeing something\u003c/td>\u003c/tr>\u003ctr>\u003ctd>conflict with\u003c/td>\u003ctd>mâu thuẫn với\u003c/td>\u003ctd>differ in a way that cannot easily be reconciled\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Thái độ và chức năng\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cụm từ\u003c/th>\u003cth>Nghĩa trong ngữ cảnh\u003c/th>\u003cth>Diễn giải tiếng Anh\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>express concern\u003c/td>\u003ctd>bày tỏ lo ngại\u003c/td>\u003ctd>show worry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>feel relieved\u003c/td>\u003ctd>cảm thấy nhẹ nhõm\u003c/td>\u003ctd>feel less worried\u003c/td>\u003c/tr>\u003ctr>\u003ctd>be doubtful\u003c/td>\u003ctd>nghi ngờ\u003c/td>\u003ctd>not be convinced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>be willing to\u003c/td>\u003ctd>sẵn lòng\u003c/td>\u003ctd>be prepared to\u003c/td>\u003c/tr>\u003ctr>\u003ctd>be reluctant to\u003c/td>\u003ctd>miễn cưỡng\u003c/td>\u003ctd>be unwilling or hesitant\u003c/td>\u003c/tr>\u003ctr>\u003ctd>clarify a point\u003c/td>\u003ctd>làm rõ một ý\u003c/td>\u003ctd>make an idea easier to understand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>correct a mistake\u003c/td>\u003ctd>sửa một lỗi\u003c/td>\u003ctd>put an error right\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reassure someone\u003c/td>\u003ctd>trấn an ai\u003c/td>\u003ctd>help someone feel less worried\u003c/td>\u003c/tr>\u003ctr>\u003ctd>persuade someone\u003c/td>\u003ctd>thuyết phục ai\u003c/td>\u003ctd>encourage someone to accept an idea\u003c/td>\u003c/tr>\u003ctr>\u003ctd>acknowledge a limitation\u003c/td>\u003ctd>thừa nhận giới hạn\u003c/td>\u003ctd>recognise a constraint\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}, {"id": 7, "title": "Bộ luyện Listening ba mươi lăm câu", "html": "\u003cp>Bộ câu hỏi và transcript dưới đây được tự biên soạn cho mục đích tự học. Cấu trúc số câu theo ba phần 8–12–15; độ dài, tốc độ và giọng đọc chưa được chuẩn hóa như kỳ thi thật. Trong HTML, chọn từng bài hoặc luyện tổng hợp 35 câu với đồng hồ 40 phút tự giới hạn. Có thể nghe lại; số lượt nghe và việc mở transcript được ghi nhận. Đọc câu hỏi trước khi phát. Chọn một đáp án A, B, C hoặc D. Hãy làm lần đầu không nhìn transcript ở phần 8. Khi hết thời gian tự giới hạn, HTML lưu kết quả hiện có; thời gian vẫn tiếp tục khi đóng trang. Nếu có sự cố giọng đọc, dùng chế độ từng bài không giới hạn giờ, khắc phục âm thanh rồi luyện lại.\u003c/p>\n\u003ch3>S01 A change to the workshop\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S01 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>1. What time will the workshop begin?\u003c/strong>\u003c/p>\n\u003cp>A. 9:00\u003c/p>\n\u003cp>B. 10:00\u003c/p>\n\u003cp>C. 10:30\u003c/p>\n\u003cp>D. 12:30\u003c/p>\n\u003ch3>S02 Collecting a reserved book\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S02 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>2. Where should the listener collect the book?\u003c/strong>\u003c/p>\n\u003cp>A. At the ground-floor information desk\u003c/p>\n\u003cp>B. At the upstairs reservation desk\u003c/p>\n\u003cp>C. From the return box\u003c/p>\n\u003cp>D. At the repair office\u003c/p>\n\u003ch3>S03 A refund at the cinema\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S03 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>3. What should a customer with a paper ticket do to get a refund?\u003c/strong>\u003c/p>\n\u003cp>A. Wait for the café to call\u003c/p>\n\u003cp>B. Return on Sunday evening\u003c/p>\n\u003cp>C. Buy another ticket online\u003c/p>\n\u003cp>D. Take the ticket to the box office before Sunday\u003c/p>\n\u003ch3>S04 A message for new volunteers\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S04 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>4. What is the main purpose of the message?\u003c/strong>\u003c/p>\n\u003cp>A. To sell gardening equipment\u003c/p>\n\u003cp>B. To introduce new volunteers to the garden\u003c/p>\n\u003cp>C. To announce that the garden is closing\u003c/p>\n\u003cp>D. To recruit professional gardeners only\u003c/p>\n\u003ch3>S05 A revised delivery\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S05 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>5. Why has the delivery been changed?\u003c/strong>\u003c/p>\n\u003cp>A. The desk has been damaged\u003c/p>\n\u003cp>B. The customer ordered the wrong item\u003c/p>\n\u003cp>C. The road will be closed\u003c/p>\n\u003cp>D. An additional payment is required\u003c/p>\n\u003ch3>S06 A ticket at the museum\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S06 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>6. Which activity requires an additional payment?\u003c/strong>\u003c/p>\n\u003cp>A. Visiting the permanent collection\u003c/p>\n\u003cp>B. Taking the guided tour\u003c/p>\n\u003cp>C. Seeing the photography exhibition\u003c/p>\n\u003cp>D. Joining the upstairs workshop\u003c/p>\n\u003ch3>S07 An announcement before departure\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S07 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>7. Where is this announcement most likely being made?\u003c/strong>\u003c/p>\n\u003cp>A. On an aircraft\u003c/p>\n\u003cp>B. In a bookshop\u003c/p>\n\u003cp>C. At a railway ticket office\u003c/p>\n\u003cp>D. In a hotel lobby\u003c/p>\n\u003ch3>S08 Choosing an evening class\u003c/h3>\n\u003cp>Part 1 · Mở mã bài S08 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>8. What must people do before attending the free first session?\u003c/strong>\u003c/p>\n\u003cp>A. Pay for all eight sessions\u003c/p>\n\u003cp>B. Reserve a place\u003c/p>\n\u003cp>C. Show evidence of previous study\u003c/p>\n\u003cp>D. Attend a Wednesday class\u003c/p>\n\u003ch3>C01 Planning a student project\u003c/h3>\n\u003cp>Part 2 · Mở mã bài C01 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>9. What are the students mainly discussing?\u003c/strong>\u003c/p>\n\u003cp>A. How to buy video equipment\u003c/p>\n\u003cp>B. How to prepare their research presentation\u003c/p>\n\u003cp>C. Why the library should close earlier\u003c/p>\n\u003cp>D. Which department they should join\u003c/p>\n\u003cp>\u003cstrong>10. Why does Maya prefer not to make a video?\u003c/strong>\u003c/p>\n\u003cp>A. The camera is too expensive\u003c/p>\n\u003cp>B. Their tutor has forbidden interviews\u003c/p>\n\u003cp>C. They have no survey responses\u003c/p>\n\u003cp>D. Editing may take too much time\u003c/p>\n\u003cp>\u003cstrong>11. What limitation should they mention?\u003c/strong>\u003c/p>\n\u003cp>A. Most respondents are from their own department\u003c/p>\n\u003cp>B. All the survey questions were unclear\u003c/p>\n\u003cp>C. The results were collected several years ago\u003c/p>\n\u003cp>D. Nobody answered the questions about study spaces\u003c/p>\n\u003cp>\u003cstrong>12. What will the first student do by Tuesday evening?\u003c/strong>\u003c/p>\n\u003cp>A. Finish the entire written report\u003c/p>\n\u003cp>B. Interview the tutor\u003c/p>\n\u003cp>C. Send Maya the charts\u003c/p>\n\u003cp>D. Reserve a camera\u003c/p>\n\u003ch3>C02 Choosing a travel option\u003c/h3>\n\u003cp>Part 2 · Mở mã bài C02 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>13. Why does the traveller choose the direct train?\u003c/strong>\u003c/p>\n\u003cp>A. It is the earliest train\u003c/p>\n\u003cp>B. It includes a free meal\u003c/p>\n\u003cp>C. It avoids the risk of a missed connection\u003c/p>\n\u003cp>D. It arrives after the course starts\u003c/p>\n\u003cp>\u003cstrong>14. What time does the direct train now leave?\u003c/strong>\u003c/p>\n\u003cp>A. 6:40\u003c/p>\n\u003cp>B. 6:15\u003c/p>\n\u003cp>C. 6:20\u003c/p>\n\u003cp>D. 8:10\u003c/p>\n\u003cp>\u003cstrong>15. Why is a flexible return ticket useful for the traveller?\u003c/strong>\u003c/p>\n\u003cp>A. It always costs less online\u003c/p>\n\u003cp>B. It guarantees a seat on every service\u003c/p>\n\u003cp>C. It removes the need for a morning ticket\u003c/p>\n\u003cp>D. The course finishing time is uncertain\u003c/p>\n\u003cp>\u003cstrong>16. What does the staff member advise about using a phone ticket?\u003c/strong>\u003c/p>\n\u003cp>A. Keep the screen dark\u003c/p>\n\u003cp>B. Make sure the phone is charged\u003c/p>\n\u003cp>C. Send the ticket to the tutor\u003c/p>\n\u003cp>D. Leave the phone at the station\u003c/p>\n\u003ch3>C03 Organising a community event\u003c/h3>\n\u003cp>Part 2 · Mở mã bài C03 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>17. What is the main aim of the event?\u003c/strong>\u003c/p>\n\u003cp>A. To sell new household items\u003c/p>\n\u003cp>B. To repair every electrical appliance\u003c/p>\n\u003cp>C. To raise money for a bicycle shop\u003c/p>\n\u003cp>D. To help people learn repair skills\u003c/p>\n\u003cp>\u003cstrong>18. Who needs to book a time?\u003c/strong>\u003c/p>\n\u003cp>A. Anyone who wants to watch\u003c/p>\n\u003cp>B. People bringing bicycles for checks\u003c/p>\n\u003cp>C. All visitors with clothing repairs\u003c/p>\n\u003cp>D. Volunteers bringing thread\u003c/p>\n\u003cp>\u003cstrong>19. What should visitors bring when necessary?\u003c/strong>\u003c/p>\n\u003cp>A. All the basic tools\u003c/p>\n\u003cp>B. Their own chairs\u003c/p>\n\u003cp>C. Special materials needed for their items\u003c/p>\n\u003cp>D. A qualification in repair work\u003c/p>\n\u003cp>\u003cstrong>20. Why does Daniel say that counting repaired items would miss the main benefit?\u003c/strong>\u003c/p>\n\u003cp>A. Learning is an important outcome even when an item is not repaired\u003c/p>\n\u003cp>B. The organisers have no way to count visitors\u003c/p>\n\u003cp>C. Only new items can be counted\u003c/p>\n\u003cp>D. The event is mainly for professional mechanics\u003c/p>\n\u003ch3>T01 Reviewing a bicycle loan scheme\u003c/h3>\n\u003cp>Part 3 · Mở mã bài T01 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>21. What is the main purpose of the talk?\u003c/strong>\u003c/p>\n\u003cp>A. To review a college bicycle loan scheme\u003c/p>\n\u003cp>B. To teach professional bicycle repair\u003c/p>\n\u003cp>C. To advertise new bicycles for sale\u003c/p>\n\u003cp>D. To explain how to pass a driving test\u003c/p>\n\u003cp>\u003cstrong>22. Which users were more common than originally expected?\u003c/strong>\u003c/p>\n\u003cp>A. Only first-year students\u003c/p>\n\u003cp>B. Local shop owners\u003c/p>\n\u003cp>C. Final-year students whose bicycles were being repaired\u003c/p>\n\u003cp>D. Members of the public with no college connection\u003c/p>\n\u003cp>\u003cstrong>23. What change was made to the collection arrangements?\u003c/strong>\u003c/p>\n\u003cp>A. The desk was permanently closed\u003c/p>\n\u003cp>B. Collection was offered at the main entrance twice a week\u003c/p>\n\u003cp>C. Students had to collect bicycles outside the city\u003c/p>\n\u003cp>D. All collections moved to the weekend\u003c/p>\n\u003cp>\u003cstrong>24. Why is warmer weather mentioned?\u003c/strong>\u003c/p>\n\u003cp>A. To show that the bicycles were unsafe in summer\u003c/p>\n\u003cp>B. To explain why reminders were cancelled\u003c/p>\n\u003cp>C. To prove that location had no effect\u003c/p>\n\u003cp>D. To identify another possible reason for increased borrowing\u003c/p>\n\u003cp>\u003cstrong>25. What will the college do before substantially expanding the fleet?\u003c/strong>\u003c/p>\n\u003cp>A. Remove all return instructions\u003c/p>\n\u003cp>B. Check demand for different sizes and maintenance needs\u003c/p>\n\u003cp>C. Stop collecting feedback\u003c/p>\n\u003cp>D. Guarantee every student a new bicycle\u003c/p>\n\u003ch3>T02 Recording local memories\u003c/h3>\n\u003cp>Part 3 · Mở mã bài T02 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>26. Why is the museum collecting oral accounts?\u003c/strong>\u003c/p>\n\u003cp>A. To replace every photograph with a recording\u003c/p>\n\u003cp>B. To discover the exact price of all market goods\u003c/p>\n\u003cp>C. To learn about everyday experiences not fully shown in photographs\u003c/p>\n\u003cp>D. To persuade people to reopen all the old shops\u003c/p>\n\u003cp>\u003cstrong>27. Which question best follows the speaker’s advice?\u003c/strong>\u003c/p>\n\u003cp>A. What was a normal morning in the market like?\u003c/p>\n\u003cp>B. Can you list every date without explanation?\u003c/p>\n\u003cp>C. Will you give the same answer as the last participant?\u003c/p>\n\u003cp>D. Why are all your memories certainly correct?\u003c/p>\n\u003cp>\u003cstrong>28. How are conflicting accounts handled?\u003c/strong>\u003c/p>\n\u003cp>A. The less dramatic account is deleted\u003c/p>\n\u003cp>B. Both accounts are replaced by a fictional story\u003c/p>\n\u003cp>C. Only the newest account is accepted\u003c/p>\n\u003cp>D. They are kept separately and compared with other evidence\u003c/p>\n\u003cp>\u003cstrong>29. What can a participant choose to permit?\u003c/strong>\u003c/p>\n\u003cp>A. Public use is compulsory whenever recording is allowed\u003c/p>\n\u003cp>B. Archiving the recording without publishing it online\u003c/p>\n\u003cp>C. Only a recording that contains no personal memories\u003c/p>\n\u003cp>D. Any use decided by the interviewer later\u003c/p>\n\u003cp>\u003cstrong>30. What does the final paragraph suggest about the exhibition?\u003c/strong>\u003c/p>\n\u003cp>A. It will present different perspectives on the market\u003c/p>\n\u003cp>B. It will prove that every memory is false\u003c/p>\n\u003cp>C. It will use only business records\u003c/p>\n\u003cp>D. It will hide when the interviews were recorded\u003c/p>\n\u003ch3>T03 Evaluating a community survey\u003c/h3>\n\u003cp>Part 3 · Mở mã bài T03 trong Listening Studio.\u003c/p>\n\u003cp>\u003cstrong>31. What is the talk mainly about?\u003c/strong>\u003c/p>\n\u003cp>A. How to become a professional photographer\u003c/p>\n\u003cp>B. How to interpret a survey when planning classes\u003c/p>\n\u003cp>C. Why community centres should stop using email\u003c/p>\n\u003cp>D. Why all surveys produce identical results\u003c/p>\n\u003cp>\u003cstrong>32. Who might be missing from the survey?\u003c/strong>\u003c/p>\n\u003cp>A. People already on the centre’s email list\u003c/p>\n\u003cp>B. Every person who likes photography\u003c/p>\n\u003cp>C. All previous participants\u003c/p>\n\u003cp>D. Residents who have never registered with the centre\u003c/p>\n\u003cp>\u003cstrong>33. Why does the speaker mention the words enjoyable and ordinary?\u003c/strong>\u003c/p>\n\u003cp>A. To show that computer courses are always boring\u003c/p>\n\u003cp>B. To recommend colourful advertising\u003c/p>\n\u003cp>C. To illustrate how wording can favour one option\u003c/p>\n\u003cp>D. To explain why no equipment is needed\u003c/p>\n\u003cp>\u003cstrong>34. What is suggested before promising a full course?\u003c/strong>\u003c/p>\n\u003cp>A. Run a small introductory session\u003c/p>\n\u003cp>B. Purchase equipment for every resident\u003c/p>\n\u003cp>C. Ignore the teacher’s availability\u003c/p>\n\u003cp>D. Close all existing classes\u003c/p>\n\u003cp>\u003cstrong>35. Which conclusion is best supported by the survey?\u003c/strong>\u003c/p>\n\u003cp>A. Everyone in the neighbourhood wants photography\u003c/p>\n\u003cp>B. Photography was the most selected subject among the respondents\u003c/p>\n\u003cp>C. A photography course will certainly make a profit\u003c/p>\n\u003cp>D. Email users never attend evening classes\u003c/p>"}, {"id": 8, "title": "Transcript và lời giải", "html": "\u003cp>Chỉ mở phần này sau khi làm bài. Mỗi câu có đáp án, bằng chứng và lý do loại lựa chọn gây nhiễu. Lời giải thuộc đề tự biên soạn ở phần 7, không phải key MP3 gốc của sách. Để nghe trong Word, mở HTML đi kèm và chọn mã bài tương ứng; Word không chứa tệp âm thanh.\u003c/p>\n\u003ch3>Bảng đáp án nhanh\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003cth>Câu\u003c/th>\u003cth>Đáp án\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>C\u003c/td>\u003ctd>2\u003c/td>\u003ctd>A\u003c/td>\u003ctd>3\u003c/td>\u003ctd>D\u003c/td>\u003ctd>4\u003c/td>\u003ctd>B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>C\u003c/td>\u003ctd>6\u003c/td>\u003ctd>D\u003c/td>\u003ctd>7\u003c/td>\u003ctd>A\u003c/td>\u003ctd>8\u003c/td>\u003ctd>B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>B\u003c/td>\u003ctd>10\u003c/td>\u003ctd>D\u003c/td>\u003ctd>11\u003c/td>\u003ctd>A\u003c/td>\u003ctd>12\u003c/td>\u003ctd>C\u003c/td>\u003c/tr>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>C\u003c/td>\u003ctd>14\u003c/td>\u003ctd>A\u003c/td>\u003ctd>15\u003c/td>\u003ctd>D\u003c/td>\u003ctd>16\u003c/td>\u003ctd>B\u003c/td>\u003c/tr>\u003ctr>\u003ctd>17\u003c/td>\u003ctd>D\u003c/td>\u003ctd>18\u003c/td>\u003ctd>B\u003c/td>\u003ctd>19\u003c/td>\u003ctd>C\u003c/td>\u003ctd>20\u003c/td>\u003ctd>A\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21\u003c/td>\u003ctd>A\u003c/td>\u003ctd>22\u003c/td>\u003ctd>C\u003c/td>\u003ctd>23\u003c/td>\u003ctd>B\u003c/td>\u003ctd>24\u003c/td>\u003ctd>D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25\u003c/td>\u003ctd>B\u003c/td>\u003ctd>26\u003c/td>\u003ctd>C\u003c/td>\u003ctd>27\u003c/td>\u003ctd>A\u003c/td>\u003ctd>28\u003c/td>\u003ctd>D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>29\u003c/td>\u003ctd>B\u003c/td>\u003ctd>30\u003c/td>\u003ctd>A\u003c/td>\u003ctd>31\u003c/td>\u003ctd>B\u003c/td>\u003ctd>32\u003c/td>\u003ctd>D\u003c/td>\u003c/tr>\u003ctr>\u003ctd>33\u003c/td>\u003ctd>C\u003c/td>\u003ctd>34\u003c/td>\u003ctd>A\u003c/td>\u003ctd>35\u003c/td>\u003ctd>B\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>S01 A change to the workshop\u003c/h3>\n\u003cp>This is a message for everyone attending the photography workshop on Saturday. The doors will still open at nine, so you can arrive early and look at the exhibition. However, our instructor has been delayed. The workshop itself will begin at half past ten instead of ten. It will finish at twelve thirty as planned. Please bring your booking confirmation.\u003c/p>\n\u003cp>\u003cstrong>Câu 1\u003c/strong> Đáp án C. “begin at half past ten instead of ten” chốt giờ mới là 10:30. 9:00 là giờ mở cửa; 10:00 là lịch cũ; 12:30 là giờ kết thúc.\u003c/p>\n\u003ch3>S02 Collecting a reserved book\u003c/h3>\n\u003cp>Your reserved book is now available. Please collect it from the information desk on the ground floor. We normally keep reservations upstairs, but that desk is closed for repairs this week. Bring your library card. If you cannot come by Friday, call us and we can keep the book until Monday. Please do not use the return box to collect reservations.\u003c/p>\n\u003cp>\u003cstrong>Câu 2\u003c/strong> Đáp án A. Nơi lấy sách hiện tại là “the information desk on the ground floor”. Upstairs là vị trí thường lệ đang đóng; return box không dùng để lấy; không có repair office để nhận sách.\u003c/p>\n\u003ch3>S03 A refund at the cinema\u003c/h3>\n\u003cp>We are sorry that tonight’s film has been cancelled because the projector is not working. You can exchange your ticket for another screening or request a refund. To receive a refund, take your ticket to the box office before Sunday. Please do not call the café about this issue. Tickets bought online can be refunded through the website instead.\u003c/p>\n\u003cp>\u003cstrong>Câu 3\u003c/strong> Đáp án D. “take your ticket to the box office before Sunday” là hành động được yêu cầu. Website áp dụng cho vé mua online; café không xử lý; Sunday evening đã không đáp ứng before Sunday.\u003c/p>\n\u003ch3>S04 A message for new volunteers\u003c/h3>\n\u003cp>Welcome to the community garden. Before you start, please put your bags in the small shed near the entrance. Gardening gloves are provided, but you should bring your own drinking water. Today we will show you where the tools are kept and explain the watering schedule. You do not need any gardening experience. We will work in pairs so nobody has to begin alone.\u003c/p>\n\u003cp>\u003cstrong>Câu 4\u003c/strong> Đáp án B. Lời chào và các hướng dẫn ban đầu dành cho tình nguyện viên mới. Có công cụ nhưng không bán; không đóng vườn; câu “do not need any gardening experience” loại D.\u003c/p>\n\u003ch3>S05 A revised delivery\u003c/h3>\n\u003cp>Hello, this is West Street Furniture. We were due to deliver your desk on Tuesday morning. Unfortunately, the road outside your building will be closed that day. We have arranged delivery for Wednesday afternoon at no extra charge. The desk is ready and undamaged. Please call us today if the new time is inconvenient; you do not need to order the item again.\u003c/p>\n\u003cp>\u003cstrong>Câu 5\u003c/strong> Đáp án C. Đường bị đóng là nguyên nhân nêu trực tiếp. Người nói xác nhận bàn nguyên vẹn, không thêm phí và không cần đặt lại; các ý đó loại A, B, D.\u003c/p>\n\u003ch3>S06 A ticket at the museum\u003c/h3>\n\u003cp>Your ticket includes entry to the permanent collection and the temporary photography exhibition. The guided tour is also included, but you need to reserve a place because groups are small. The workshop upstairs costs an extra five pounds. Photography is allowed without flash in the permanent collection, but it is not permitted in the temporary exhibition. Please ask at reception if you need directions.\u003c/p>\n\u003cp>\u003cstrong>Câu 6\u003c/strong> Đáp án D. “costs an extra five pounds” chỉ workshop. Ba lựa chọn còn lại đều nằm trong vé; tour cần đặt chỗ nhưng không đồng nghĩa thêm phí.\u003c/p>\n\u003ch3>S07 An announcement before departure\u003c/h3>\n\u003cp>Good evening, passengers. We are ready to depart, but please keep the aisle clear while the remaining bags are placed in the overhead compartments. Your seat belts must remain fastened until the sign is turned off. If you need assistance, press the button above your seat and a member of the cabin crew will come to you. Thank you for your cooperation.\u003c/p>\n\u003cp>\u003cstrong>Câu 7\u003c/strong> Đáp án A. Overhead compartments, seat belts và cabin crew cùng tạo bối cảnh máy bay. Chỉ từ passengers thì chưa đủ vì tàu cũng có hành khách; các dấu hiệu kết hợp mới quyết định.\u003c/p>\n\u003ch3>S08 Choosing an evening class\u003c/h3>\n\u003cp>Our beginner Spanish course starts next month. Classes take place on Monday evenings, not Wednesdays as stated in the old leaflet. You can try the first session without paying, but please book a place in advance. After that, there is a fee for the remaining seven sessions. The course is for adults who have never studied Spanish, so previous experience is not necessary.\u003c/p>\n\u003cp>\u003cstrong>Câu 8\u003c/strong> Đáp án B. Buổi đầu miễn phí nhưng “please book a place in advance”. Không cần học trước hay đóng tiền ngay; Wednesday là thông tin cũ đã sửa.\u003c/p>\n\u003ch3>C01 Planning a student project\u003c/h3>\n\u003cp>\u003cstrong>A:\u003c/strong> Hi, Maya. Have you decided how we should present our research project? I was thinking about interviewing students on video. It would be more interesting than a long written report.\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Video could work, but remember the deadline is next Friday. We have only collected half of the survey responses. Editing interviews might take more time than we have.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> That is true. We could borrow a camera from the media office, though. The equipment would not cost anything.\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> The cost is not my main concern. It is the editing. Neither of us has done it before. Why not make a short slide presentation and use a few anonymous quotes from the survey?\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> Good idea. We can show the main findings on three charts. Shall we include all twenty survey questions?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> I would focus on the questions about study spaces. That is what our tutor asked us to investigate. We can put the other results in an appendix, in case anyone asks.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> All right. I will prepare the charts. Could you write a short explanation of how we collected the data?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Yes, but we should mention that most respondents are from our department. Our results may not represent every student on campus.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> I nearly forgot that. We should be careful about saying students prefer quiet rooms if we only asked people we know.\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Exactly. Let us meet in the library on Wednesday afternoon to put everything together. Then we will have Thursday to practise.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> Wednesday is fine. I will send you the charts by Tuesday evening, so you can check them first.\u003c/p>\n\u003cp>\u003cstrong>Câu 9\u003c/strong> Đáp án B. Hai người chọn hình thức trình bày, chia việc và hẹn hoàn thiện. Camera và thư viện là chi tiết phụ; không nói đóng thư viện hay chọn ngành.\u003c/p>\n\u003cp>\u003cstrong>Câu 10\u003c/strong> Đáp án D. Maya nói “It is the editing” và cả hai chưa biết dựng. Camera miễn phí nên A sai; không có lệnh cấm; đã thu được một nửa phản hồi nên C sai.\u003c/p>\n\u003cp>\u003cstrong>Câu 11\u003c/strong> Đáp án A. Mẫu trả lời tập trung ở khoa của họ nên không đại diện toàn trường. Những hạn chế ở B, C, D không được nêu.\u003c/p>\n\u003cp>\u003cstrong>Câu 12\u003c/strong> Đáp án C. Lời cuối chốt gửi charts vào Tuesday evening. Gặp ở thư viện là Wednesday, còn phương án video đã bỏ; không có cam kết hoàn thành toàn bộ report.\u003c/p>\n\u003ch3>C02 Choosing a travel option\u003c/h3>\n\u003cp>\u003cstrong>A:\u003c/strong> Hello. I am going to Northbridge for a training course next week, and I need some help choosing a ticket. I used to take the six fifteen train, but I heard the timetable has changed.\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> It has. The direct train now leaves at six forty and arrives at eight ten. There is also a cheaper service at six twenty, but you have to change trains at Hillford.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> My course begins at nine, so either arrival time could work. How long is the connection at Hillford?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Only seven minutes. It is usually enough, but if the first train is late you could miss the connection. The next one would get you to Northbridge after nine.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> I would rather avoid that risk on the first day. I will take the direct train. Can I come back on any train in the evening?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> With the flexible return ticket, yes. The cheaper fixed ticket is valid only on the train you select. It cannot be used on a later service if your course finishes late.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> The tutor has not confirmed the finishing time, so the flexible return sounds better. Is there a discount for booking online?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> The price is the same online and at the station. You can, however, save money if you travel after nine in the morning. That would not help you on this journey.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> No, it would make me late. One direct ticket with a flexible return, please. Do I need to print it?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> You can show the ticket on your phone. Keep the screen bright enough for the scanner, and make sure the phone is charged. If you prefer, we can print a copy here.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> I will use my phone and bring a charger. Thank you for explaining the options.\u003c/p>\n\u003cp>\u003cstrong>Câu 13\u003c/strong> Đáp án C. Người đi muốn tránh nguy cơ lỡ nối chuyến. Tàu rẻ hơn rời sớm hơn nên A sai; không có bữa ăn; tàu trực tiếp đến 8:10 trước giờ học 9:00.\u003c/p>\n\u003cp>\u003cstrong>Câu 14\u003c/strong> Đáp án A. “now leaves at six forty”. 6:15 là lịch cũ, 6:20 là chuyến phải đổi tàu, 8:10 là giờ đến.\u003c/p>\n\u003cp>\u003cstrong>Câu 15\u003c/strong> Đáp án D. Chưa xác nhận giờ kết thúc nên cần linh hoạt chọn chuyến về. Giá online bằng tại ga; không nêu bảo đảm ghế; vẫn phải mua vé đi.\u003c/p>\n\u003cp>\u003cstrong>Câu 16\u003c/strong> Đáp án B. Người bán nhắc pin và độ sáng màn hình. A trái với lời nhắc; C, D không xuất hiện.\u003c/p>\n\u003ch3>C03 Organising a community event\u003c/h3>\n\u003cp>\u003cstrong>A:\u003c/strong> Thanks for meeting me, Daniel. We need to finalise the repair event for Saturday. I have booked the community hall from ten until four, but I am worried that people will expect us to fix everything they bring.\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Then we should make the limits clear. Our volunteers can help with simple clothing repairs and basic bicycle checks. We cannot accept large electrical appliances. We do not have the right equipment or qualified staff for those.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> Agreed. I will update the poster. Should we ask everyone to book a time?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> For bicycles, yes. Each check can take half an hour, and we only have two volunteers. For clothing repairs, people can arrive without an appointment, as long as they are prepared to wait.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> Some visitors may just want to watch and learn. Is that all right?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Of course. In fact, we want people to take part rather than leave an item and disappear. The purpose is to share skills, not to operate a free repair shop.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> That is a useful distinction. What about tools and materials?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> We have the tools, but visitors should bring any special materials, such as a matching zip or unusual buttons. We will have ordinary thread and a few basic supplies.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> I was going to advertise free repairs. Perhaps that would create the wrong impression.\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Yes. You could say, learn to repair everyday items with volunteer support. We also need to explain that we cannot guarantee that every item will be repaired.\u003c/p>\n\u003cp>\u003cstrong>A:\u003c/strong> I will use that wording. Shall we collect feedback at the end?\u003c/p>\n\u003cp>\u003cstrong>B:\u003c/strong> Definitely. Ask visitors what they learned and whether they would try a similar repair at home. Counting repaired items alone would miss the main benefit.\u003c/p>\n\u003cp>\u003cstrong>Câu 17\u003c/strong> Đáp án D. Daniel nói “share skills” và khuyến khích người tham gia tự làm. Không phải bán hàng, gây quỹ hay nhận mọi đồ điện.\u003c/p>\n\u003cp>\u003cstrong>Câu 18\u003c/strong> Đáp án B. Bicycle checks cần đặt giờ vì ít tình nguyện viên và mất thời gian. Clothing có thể đến không hẹn nếu chấp nhận chờ; không yêu cầu cả người xem đặt lịch.\u003c/p>\n\u003cp>\u003cstrong>Câu 19\u003c/strong> Đáp án C. Ví dụ được nêu là matching zip hoặc unusual buttons. Ban tổ chức có tools và đồ cơ bản; không yêu cầu chứng chỉ.\u003c/p>\n\u003cp>\u003cstrong>Câu 20\u003c/strong> Đáp án A. Câu trước hỏi người đến học được gì và có thể thử ở nhà không; tiêu chí lợi ích là học kỹ năng. B và C không có bằng chứng; D trái với tính cộng đồng.\u003c/p>\n\u003ch3>T01 Reviewing a bicycle loan scheme\u003c/h3>\n\u003cp>Today I would like to describe a small bicycle loan scheme at our college and explain what we learned from its first term. The aim was to help students make short local journeys without buying a bicycle immediately. We began with twenty second-hand bicycles, all checked by a qualified mechanic. Students could borrow one for up to a week after completing a short safety briefing.\u003c/p>\n\u003cp>Before the scheme opened, we expected first-year students to be the main users. In fact, many borrowers were students in their final year whose own bicycles were being repaired. This did not mean the scheme had failed. It meant that our original picture of the users was too narrow. The survey helped us notice a need we had not planned for.\u003c/p>\n\u003cp>A second finding concerned where the bicycles were collected. At first, collection was available only from the sports centre, which was far from most teaching buildings. We moved the collection desk to the main entrance twice a week. Borrowing increased after that change, although we cannot say that location was the only cause. The weather also became warmer during the same period.\u003c/p>\n\u003cp>There were problems. Some bicycles were returned late, which disappointed people waiting for them. We introduced reminder messages the day before a bicycle was due back. We did not immediately introduce fines because we wanted to understand why returns were late. Several students said they had misunderstood whether the return date included the weekend.\u003c/p>\n\u003cp>For the next term, the college plans to keep clearer return instructions and improve the booking page. We are considering more bicycles, but buying twice as many will not automatically make the service twice as useful. We first need to know which sizes are most often requested and how much maintenance each bicycle needs. A good scheme depends on reliable equipment and convenient access, not simply a large total number of bicycles.\u003c/p>\n\u003cp>\u003cstrong>Câu 21\u003c/strong> Đáp án A. Bài mô tả chương trình, kết quả, vấn đề và bước tiếp theo. B, C, D là hoạt động khác; mechanic chỉ là người kiểm tra xe.\u003c/p>\n\u003cp>\u003cstrong>Câu 22\u003c/strong> Đáp án C. Dự kiến first-year, thực tế nhiều final-year có xe đang sửa. Phân biệt dự đoán trước với phát hiện sau.\u003c/p>\n\u003cp>\u003cstrong>Câu 23\u003c/strong> Đáp án B. “main entrance twice a week” là thay đổi cụ thể. Không đóng dịch vụ, chuyển ra ngoài thành phố hay chỉ mở cuối tuần.\u003c/p>\n\u003cp>\u003cstrong>Câu 24\u003c/strong> Đáp án D. Thời tiết ấm lên là yếu tố khác có thể góp phần tăng lượt mượn. Không thể khẳng định riêng việc dời địa điểm gây ra toàn bộ thay đổi; cũng không chứng minh địa điểm vô tác dụng.\u003c/p>\n\u003cp>\u003cstrong>Câu 25\u003c/strong> Đáp án B. Người nói ưu tiên biết sizes và maintenance trước khi tăng số lượng. A, C ngược kế hoạch; D không được hứa.\u003c/p>\n\u003ch3>T02 Recording local memories\u003c/h3>\n\u003cp>Our local museum has begun a project to record memories of the old market. The market building has changed several times, and photographs tell only part of its story. We want to hear from people who worked there, shopped there or lived nearby. Their experiences can help us understand how the place was used in everyday life.\u003c/p>\n\u003cp>Volunteers sometimes think that an interview should collect as many dates as possible. Dates matter, but a useful interview also asks how things felt and why people made particular choices. Instead of asking only when a shop opened, you might ask what a normal morning in the market was like. That question gives the speaker room to describe sounds, routines and relationships.\u003c/p>\n\u003cp>However, a vivid memory is not automatically an accurate record of every detail. Two people may remember the same event differently. We do not erase one account simply because it conflicts with another. We keep the accounts separate and, where possible, compare them with photographs, newspapers or business records. Differences can tell us something about perspective as well as about mistakes.\u003c/p>\n\u003cp>Permission is another essential part of the project. Before recording, volunteers explain where the interview may be used. A participant can agree to a recording for the archive but refuse permission for it to appear on the public website. Those are different choices. If someone does not want to answer a question, the interviewer moves on rather than putting pressure on them.\u003c/p>\n\u003cp>For the first exhibition, we will use short extracts with clear labels about who is speaking and when the interview was made. The full recordings will be stored securely in the museum archive, subject to the permissions given. Our aim is not to produce one perfect story that everyone must accept. It is to let visitors encounter several experiences of the same place and to think carefully about how we learn from memories.\u003c/p>\n\u003cp>\u003cstrong>Câu 26\u003c/strong> Đáp án C. Photographs chỉ kể một phần; trải nghiệm giúp hiểu đời sống ở chợ. Không loại bỏ ảnh hay khôi phục mọi cửa hàng.\u003c/p>\n\u003cp>\u003cstrong>Câu 27\u003c/strong> Đáp án A. Câu mở mời mô tả routines và cảm giác. B quá hẹp, C áp đặt câu trả lời, D mặc định ký ức luôn đúng.\u003c/p>\n\u003cp>\u003cstrong>Câu 28\u003c/strong> Đáp án D. Giữ riêng và đối chiếu photographs, newspapers, records. Không xóa chỉ vì mâu thuẫn; không bịa câu chuyện thay thế.\u003c/p>\n\u003cp>\u003cstrong>Câu 29\u003c/strong> Đáp án B. Đồng ý lưu archive không đồng nghĩa cho đăng website. A và D phủ nhận quyền lựa chọn; C không có trong đoạn.\u003c/p>\n\u003cp>\u003cstrong>Câu 30\u003c/strong> Đáp án A. Mục tiêu là “several experiences of the same place”. Không phủ nhận mọi ký ức, không chỉ dùng hồ sơ kinh doanh, và có nhãn thời điểm ghi âm.\u003c/p>\n\u003ch3>T03 Evaluating a community survey\u003c/h3>\n\u003cp>Suppose a neighbourhood centre wants to introduce evening classes. It sends a questionnaire to people on its email list and receives one hundred responses. Seventy respondents choose photography, so the organiser concludes that photography is the most popular subject in the whole neighbourhood. Is that conclusion justified? We need to look more closely at who had a chance to answer.\u003c/p>\n\u003cp>The email list contains people who have already attended activities at the centre. It may exclude residents who are interested but have never registered, and people who do not regularly use email. Seventy out of a hundred is a clear result for the respondents, but it does not necessarily describe everyone who lives nearby. The first lesson is to identify the group your data actually represents.\u003c/p>\n\u003cp>Question wording can also influence responses. Imagine asking, would you like an enjoyable photography class or an ordinary computer class? The adjectives make the options unequal. A fairer question would describe both subjects neutrally and give similar information about times, prices and equipment. Otherwise, people may be responding to the description rather than the subject itself.\u003c/p>\n\u003cp>Practical constraints still matter after preferences have been collected. Photography may be popular, but the centre might not have suitable equipment or an available teacher. Rather than promising a full course immediately, it could run a small introductory session and collect feedback. Attendance would show whether people who expressed interest were able to come at the proposed time.\u003c/p>\n\u003cp>Finally, the centre should explain what it has learned and what remains uncertain. It can say that photography was the most selected option among those who answered the email survey. That statement is less dramatic than saying everyone wants photography, but it is more precise. Good decisions do not require pretending that a small survey answers every question. They require combining the responses with practical information and being willing to revise the plan when new evidence appears.\u003c/p>\n\u003cp>\u003cstrong>Câu 31\u003c/strong> Đáp án B. Bài bàn mẫu người trả lời, cách hỏi, giới hạn thực tế và cách dùng kết quả. Photography là ví dụ, không phải chủ đề dạy nghề ảnh.\u003c/p>\n\u003cp>\u003cstrong>Câu 32\u003c/strong> Đáp án D. Email list chỉ gồm người đã tham gia nên có thể bỏ sót cư dân chưa đăng ký. A là nhóm được liên hệ; B, C nói quá mức.\u003c/p>\n\u003cp>\u003cstrong>Câu 33\u003c/strong> Đáp án C. Hai tính từ đánh giá không cân xứng làm lựa chọn thiên lệch. Người nói đề nghị mô tả trung tính, không kết luận lớp máy tính chán.\u003c/p>\n\u003cp>\u003cstrong>Câu 34\u003c/strong> Đáp án A. Introductory session giúp kiểm tra khả năng tham gia thực tế và nhận phản hồi. Không có các hành động cực đoan B, C, D.\u003c/p>\n\u003cp>\u003cstrong>Câu 35\u003c/strong> Đáp án B. Kết luận phải giới hạn ở respondents. A mở rộng thành mọi người; C dự đoán chắc chắn lợi nhuận không có dữ kiện; D trái nội dung.\u003c/p>\n\u003ch3>Đáp án chép chính tả\u003c/h3>\n\u003cp>\u003cstrong>D01.\u003c/strong> The meeting has been moved to Thursday afternoon.\u003c/p>\n\u003cp>Cụm cần nghe: has been moved to. Đã được chuyển sang; đừng giữ lịch ban đầu.\u003c/p>\n\u003cp>\u003cstrong>D02.\u003c/strong> Please return the equipment before the office closes.\u003c/p>\n\u003cp>Cụm cần nghe: before the office closes. Trả trước khi văn phòng đóng cửa.\u003c/p>\n\u003cp>\u003cstrong>D03.\u003c/strong> You do not need to pay in advance.\u003c/p>\n\u003cp>Cụm cần nghe: do not need to. Không cần, khác với không được phép.\u003c/p>\n\u003cp>\u003cstrong>D04.\u003c/strong> The workshop is free of charge for local residents.\u003c/p>\n\u003cp>Cụm cần nghe: free of charge. Miễn phí; chú ý đối tượng local residents.\u003c/p>\n\u003cp>\u003cstrong>D05.\u003c/strong> We have run out of application forms.\u003c/p>\n\u003cp>Cụm cần nghe: run out of. Đã hết biểu mẫu.\u003c/p>\n\u003cp>\u003cstrong>D06.\u003c/strong> Could you leave a message with the receptionist?\u003c/p>\n\u003cp>Cụm cần nghe: leave a message. Để lại lời nhắn; đây là lời nhờ lịch sự.\u003c/p>\n\u003cp>\u003cstrong>D07.\u003c/strong> The price includes breakfast but not the evening meal.\u003c/p>\n\u003cp>Cụm cần nghe: but not. Bữa tối bị loại khỏi giá trọn gói.\u003c/p>\n\u003cp>\u003cstrong>D08.\u003c/strong> You can borrow two books at a time.\u003c/p>\n\u003cp>Cụm cần nghe: at a time. Mỗi lần, không phải mỗi ngày.\u003c/p>\n\u003cp>\u003cstrong>D09.\u003c/strong> The bus leaves at quarter past seven.\u003c/p>\n\u003cp>Cụm cần nghe: quarter past seven. 7 giờ 15 phút.\u003c/p>\n\u003cp>\u003cstrong>D10.\u003c/strong> I would rather work in a smaller group.\u003c/p>\n\u003cp>Cụm cần nghe: would rather. Diễn đạt sự ưu tiên.\u003c/p>\n\u003cp>\u003cstrong>D11.\u003c/strong> The results are encouraging, although the sample is small.\u003c/p>\n\u003cp>Cụm cần nghe: although. Đánh giá tích cực kèm giới hạn.\u003c/p>\n\u003cp>\u003cstrong>D12.\u003c/strong> Please check whether photography is permitted.\u003c/p>\n\u003cp>Cụm cần nghe: whether photography is permitted. Kiểm tra có được chụp ảnh hay không.\u003c/p>"}, {"id": 9, "title": "Lộ trình sáu tuần và sổ lỗi", "html": "\u003cp>Kế hoạch là gợi ý phân bổ việc học, không cam kết đạt B1 trong sáu tuần. Dành khoảng 40–60 phút mỗi ngày, năm hoặc sáu ngày mỗi tuần; giảm khối lượng nếu việc chữa chưa xong. Một buổi có thể gồm 10 phút từ vựng, 10 phút kỹ thuật, 15 phút nghe và 15 phút chữa.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tuần\u003c/th>\u003cth>Trọng tâm\u003c/th>\u003cth>Sản phẩm sau tuần\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Đo đầu vào bằng audio người thật; L1.1\u003c/td>\u003ctd>Ghi loại lỗi chính và 30 cụm từ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>L1.2 và L1.3; số, giờ, thông tin sửa\u003c/td>\u003ctd>Bảng bẫy và 40 cụm tiếp theo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>L2.1 và L2.2; ý chính, mục đích\u003c/td>\u003ctd>Tóm tắt sáu đoạn bằng một câu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>L2.3 và L2.4; cụm nghĩa, paraphrase\u003c/td>\u003ctd>Chép 10 đoạn ngắn và chữa theo bằng chứng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>L3.1 và L3.2; suy luận, chức năng\u003c/td>\u003ctd>Hoàn thành bộ 35 câu và sổ lỗi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Đề mới có người thật; đánh giá độ ổn định\u003c/td>\u003ctd>So các lần nghe đầu, kiểm tra cả bốn kỹ năng\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Sổ lỗi nên ghi gì\u003c/h3>\n\u003cp>Ghi mã bài và câu; đáp án đã chọn; bằng chứng đúng; nhóm lỗi; một việc sửa cụ thể; ngày nghe lại. Ví dụ: S01 câu 1, nhầm giờ cũ với giờ mới, ôn delayed và instead, nghe lại hôm sau. Đừng chỉ ghi chữ cái đáp án.\u003c/p>\n\u003ch3>Dấu hiệu tiến bộ\u003c/h3>\n\u003cp>Bạn nhận ra cụm từng nghe nhầm trong bài mới, giữ được mạch đoạn dài, phân biệt kế hoạch với hành động đã chốt và chỉ ra bằng chứng khi chữa. Theo dõi số câu đúng ở lần nghe đầu; tách kết quả có nghe lại hoặc có xem transcript.\u003c/p>\n\u003ch3>Khi kết quả chưa tăng\u003c/h3>\n\u003cp>Nếu đọc transcript vẫn không hiểu, ưu tiên từ vựng và ngữ pháp nền. Nếu đọc hiểu nhưng nghe không ra, luyện câu ngắn với audio thật. Nếu nghe hiểu nhưng chọn sai, tập đọc từ hỏi và giới hạn của câu. Nếu mất mạch, giảm lượng ghi chú và tiếp tục nghe thay vì cố cứu một câu đã qua.\u003c/p>"}, {"id": 10, "title": "Nguồn luyện nghe và tài liệu đối chiếu", "html": "\u003ch3>Nguồn thi và định dạng\u003c/h3>\n\u003cp>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S1]\u003c/a> ULIS ĐHQG Hà Nội, Test format và Quyết định 942 kèm định dạng VSTEP 3–5. Dùng để đối chiếu thời gian, số câu và kỹ năng được đánh giá. \u003ca href=\"https://vstep.vnu.edu.vn/test-format/\" target=\"_blank\" rel=\"noopener noreferrer\">Định dạng ULIS ↗\u003c/a> \u003ca href=\"https://vstep.vnu.edu.vn/files/uploads/2020/08/942_1-1.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Quyết định và phụ lục định dạng ↗\u003c/a> \u003ca class=\"source-ref\" href=\"#/guide/10\">[S2]\u003c/a> Trường Đại học Tài nguyên và Môi trường TP HCM, tài liệu chương trình B1 B2, mục TEST SPECIFICATION. Chỉ dùng phần Listening để đối chiếu cấu trúc 8–12–15 và nghe một lần; không suy rộng các bảng điểm nội bộ của tài liệu thành thang điểm VSTEP chung. \u003ca href=\"https://daotao.hcmunre.edu.vn/sites/default/files/uploads/files/202302/khung_chuong_trinh_giang_day_b1_b2.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Tài liệu đặc tả ↗\u003c/a>\u003c/p>\n\u003ch3>Nguồn nghe có người thật\u003c/h3>\n\u003cp>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S3]\u003c/a> Trung tâm Ngoại ngữ Trường Đại học Sư phạm TP HCM công bố liên kết bài thi nghe bậc 345 và ghi có chấm tự động. Đây là nguồn luyện qua trình duyệt; không cần plugin Google Drive. Trang đích dùng trình phát tương tác nên cần kiểm tra âm thanh trên thiết bị trước khi làm. \u003ca href=\"https://vstep.hcmue.edu.vn/thi-thu-bac-345\" target=\"_blank\" rel=\"noopener noreferrer\">Trang thi thử HCMUE ↗\u003c/a> \u003ca class=\"source-ref\" href=\"#/guide/10\">[S4]\u003c/a> British Council LearnEnglish B1 Listening có audio và bài tập theo tình huống. Bài An introduction to a lecture có transcript cùng hai hoạt động. Đây là luyện kỹ năng theo trình độ B1, không phải đề VSTEP. \u003ca href=\"https://learnenglish.britishcouncil.org/free-resources/listening/b1\" target=\"_blank\" rel=\"noopener noreferrer\">Kho nghe B1 ↗\u003c/a> \u003ca href=\"https://learnenglish.britishcouncil.org/free-resources/listening/b1/introduction-lecture\" target=\"_blank\" rel=\"noopener noreferrer\">Bài nghe mở đầu một bài giảng ↗\u003c/a>\u003c/p>\n\u003ch3>Sách và phạm vi lời giải\u003c/h3>\n\u003cp>\u003ca class=\"source-ref\" href=\"#/guide/10\">[S5]\u003c/a> Tài liệu luyện thi tổng hợp VSTEP bậc 3 B1, bản scan do bạn cung cấp. Ví dụ phân tích trong cẩm nang được đối chiếu với lời thoại in sẵn; lời giải của bộ 35 câu tự biên soạn không phải key của sách. \u003ca class=\"source-ref\" href=\"#/guide/10\">[S6]\u003c/a> Thư mục audio do bạn cung cấp: Mp3 Vstep tong hop B1. Đã mở thư mục và bản xem trước tệp 01; chưa đối chiếu nội dung của toàn bộ tệp. \u003ca href=\"https://drive.google.com/drive/folders/1P3svO0w855CHG3-blEh3M5Ns8OLs7dHk\" target=\"_blank\" rel=\"noopener noreferrer\">Audio đi cùng sách ↗\u003c/a> Ngày kiểm tra: 06/11/2026.\u003c/p>\n\u003ch3>Cách chọn bài phù hợp\u003c/h3>\n\u003cp>Nếu một đoạn B1 quá nhanh, chọn đoạn ngắn hơn và dùng transcript khi chữa, sau đó trở lại tốc độ gốc. Khi ôn độ bền, chọn bài mới và chỉ nghe một lần. Không gọi tài liệu quảng cáo trên mạng là đề thi thật nếu chưa có nguồn xác nhận.\u003c/p>"}], "lessons": [{"id": "1", "title": "Nghe để nhận diện bối cảnh", "source": "L1.1 · PDF 25–35", "html": "\u003ch3>Mình cần nghe điều gì\u003c/h3>\n\u003cp>Câu hỏi Where are the speakers, Who is the speaker và What are they doing yêu cầu dựng lại tình huống. Ghi hai hoặc ba dấu hiệu thuộc cùng một bối cảnh, rồi kiểm tra vai trò của từng người. Một từ đơn lẻ chưa đủ để kết luận.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 27 nhắc reference book, check it out và stacks. Những dấu hiệu này cùng chỉ dịch vụ mượn sách, nên bối cảnh là thư viện. PDF 29 có captain, seat belt sign và overhead compartment: người phụ nữ đang hỗ trợ hành khách; cô ấy là tiếp viên, không phải phi công chỉ vì có từ captain.\u003c/p>\n\u003ch3>Cách tự luyện\u003c/h3>\n\u003cp>Che các lựa chọn, viết một nhãn bối cảnh bằng tiếng Việt sau lần nghe đầu. Nghe lại để tìm bằng chứng về vai trò. Chỉ sau đó mới đối chiếu đáp án. Nếu đọc lời thoại mới hiểu, ghi lỗi là nhận diện âm hoặc từ vựng, chưa xem như đã nghe được.\u003c/p>\n\u003ch3>Bẫy cần nhớ\u003c/h3>\n\u003cp>Phân biệt nơi người nói đang đứng với nơi họ định đến. Bài hỏi nghề của người nói không nhất thiết chọn nghề vừa được nhắc tên. Chú ý các động từ phục vụ, mời, trả tiền, hướng dẫn và các đại từ I, you, we.\u003c/p>"}, {"id": "2", "title": "Nghe chi tiết và thông tin được sửa", "source": "L1.2 · PDF 41–50", "html": "\u003ch3>Trước khi nghe\u003c/h3>\n\u003cp>Đọc từ hỏi để biết cần một giờ, địa điểm, lý do hay hành động. Gạch từ giới hạn như now, tomorrow, before, after, NOT. Hình dung dạng đáp án, không đoán nội dung.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 41: cuộc họp dự kiến lúc 9 giờ nhưng hoãn hai giờ, nên giờ họp mới là 11 giờ. PDF 43: sách đang ở nhà; văn phòng, bảo tàng và thư viện có xuất hiện nhưng không trả lời câu hỏi về vị trí hiện tại.\u003c/p>\n\u003ch3>Quy trình ba cột\u003c/h3>\n\u003cp>Ghi rất ngắn: thông tin cũ → từ báo đổi → thông tin cuối. Ví dụ tự biên soạn: Tuesday → actually → Thursday. Đừng chốt ngay con số đầu tiên. Tuy nhiên, cũng đừng máy móc lấy con số cuối: phải gắn số với đúng đối tượng được hỏi.\u003c/p>\n\u003ch3>Lý do và yêu cầu\u003c/h3>\n\u003cp>Why hỏi nguyên nhân, không hỏi kết quả. What should listeners do hỏi hành động được yêu cầu, không phải mọi hành động có trong đoạn. PDF 47 dùng apply in person: ứng viên cần đến trực tiếp; nghe résumé không có nghĩa phải gửi hồ sơ bằng thư.\u003c/p>"}, {"id": "3", "title": "Tránh bẫy từ giống âm và giống mặt chữ", "source": "L1.3 · PDF 51–60", "html": "\u003ch3>Ba lớp cần kiểm tra\u003c/h3>\n\u003cp>Âm có giống không, nghĩa có phù hợp không và cả câu có đúng tình huống không. Người thiết kế câu hỏi có thể dùng từ gần âm, đồng âm hoặc một nghĩa khác của cùng một từ.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 51 có rain trong bản tin thời tiết nhưng lựa chọn gây nhiễu dùng train. PDF 53 phân biệt sale với sail theo bối cảnh mua sắm. PDF 54 dùng coach trong chuyến bay với ngân sách sinh viên: ở đây là hạng phổ thông, không phải xe khách.\u003c/p>\n\u003ch3>Cách luyện nghe\u003c/h3>\n\u003cp>Nghe cả cụm ít nhất ba từ: on sale, a sailing boat, travel in coach. Đọc to cụm sau khi đã nghe mẫu. Khi gặp một cặp nghe giống nhau, dùng cú pháp và nghĩa để kiểm tra thay vì cố nghe một khác biệt không tồn tại trong từ đồng âm.\u003c/p>\n\u003ch3>Mục tiêu phù hợp\u003c/h3>\n\u003cp>Không cần học thuộc mọi homophone. Ưu tiên từ thời gian, giá tiền, địa điểm và hành động thường gặp. Với câu NOT, ghi rõ đang tìm điều bị cấm, điều không đúng hay điều không được nhắc.\u003c/p>"}, {"id": "4", "title": "Bắt ý chính của hội thoại và bài nói", "source": "L2.1 · PDF 62–70", "html": "\u003ch3>Câu hỏi điển hình\u003c/h3>\n\u003cp>What are the speakers mainly discussing và What is the talk mainly about đòi hỏi một ý bao quát. Câu mở đầu thường gợi chủ đề, nhưng kết luận phải phù hợp với toàn đoạn.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 63 có cuộc trò chuyện sau buổi học ở thư viện. Vấn đề trung tâm là sử dụng dịch vụ an ninh của trường để về ký túc xá an toàn; tiền học phí và thư viện chỉ là bối cảnh, không phải chủ đề chính.\u003c/p>\n\u003ch3>Ghi chú tối giản\u003c/h3>\n\u003cp>Dùng một dòng: chủ đề + vấn đề hoặc góc nhìn. Sau đó thêm tối đa ba nhánh ý. Ví dụ: campus transport → long wait → new evening route. Nếu ghi tất cả danh từ, bạn có thể bỏ lỡ mối quan hệ giữa chúng.\u003c/p>\n\u003ch3>Chọn đáp án\u003c/h3>\n\u003cp>Loại phương án quá hẹp chỉ nhắc một ví dụ, phương án quá rộng vượt nội dung và phương án chứa từ đúng nhưng quan hệ sai. Từ được lặp lại là dấu hiệu hữu ích, không phải quy tắc đảm bảo đáp án.\u003c/p>"}, {"id": "5", "title": "Phân biệt chủ đề với mục đích", "source": "L2.2 · PDF 71–77", "html": "\u003ch3>Hai câu hỏi khác nhau\u003c/h3>\n\u003cp>Chủ đề là nói về điều gì. Mục đích là tại sao người đó nói: giải thích, đề nghị, thông báo thay đổi, xin giúp đỡ hay thuyết phục. Đáp án mục đích thường bắt đầu bằng to và động từ.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 71 nhắc chuyến đi Rạch Giá, nhưng người hỏi mở đầu để cho bạn mượn sách hướng dẫn du lịch. Chuyến đi là chủ đề dẫn nhập; cho mượn sách mới là mục đích của lời hỏi trong ngữ cảnh này.\u003c/p>\n\u003ch3>Quy trình\u003c/h3>\n\u003cp>Tìm vấn đề ban đầu, đề xuất hoặc yêu cầu chính, rồi cách cuộc trò chuyện kết thúc. Nếu câu hỏi hỏi mục đích của cả bài nói, đừng chỉ dùng mục đích của một câu nhỏ.\u003c/p>\n\u003ch3>Bài tập ngắn\u003c/h3>\n\u003cp>Nghe một lời nhắn và hoàn thành: Người nói gọi để ____. Dùng một động từ cụ thể như đổi lịch, xin xác nhận, hướng dẫn hoặc phàn nàn. Sau khi nghe lại, kiểm tra có bằng chứng cho động từ mình chọn không.\u003c/p>"}, {"id": "6", "title": "Nghe theo cụm và ghi chú đúng trọng tâm", "source": "L2.3 · PDF 78–83", "html": "\u003ch3>Vì sao phải nghe theo cụm\u003c/h3>\n\u003cp>Trong lời nói liên tục, từ thường đi với nhau thành cụm có nghĩa. Biết từng từ nhưng không ghép được cụm vẫn có thể làm bạn chậm hơn audio. Sách giới thiệu listening in chunks ở PDF 78 và bài chia câu thành nhóm ở PDF 79.\u003c/p>\n\u003ch3>Cách làm\u003c/h3>\n\u003cp>Đọc câu hỏi trước để biết cần theo dõi cái gì. Khi nghe, ghi tên người, hành động, điều kiện và kết quả bằng từ khóa hoặc mũi tên. Ghi new card → cancel old first có ích hơn việc cố chép cả câu dài.\u003c/p>\n\u003ch3>Ví dụ tự biên soạn\u003c/h3>\n\u003cp>You can renew the loan / as long as / nobody else has reserved the book. Cụm as long as đặt điều kiện. Không được rút gọn thành ai cũng gia hạn được.\u003c/p>\n\u003ch3>Chữa lỗi\u003c/h3>\n\u003cp>Nghe lại một câu ngắn, chia cụm theo nghĩa, nhìn transcript kiểm tra, rồi nghe lại không nhìn. Chép chính tả 10–20 giây là đủ cho một vòng luyện; không cần chép cả bài dài mỗi ngày.\u003c/p>"}, {"id": "7", "title": "Nhận ra cách diễn đạt tương đương", "source": "L2.4 · PDF 84–90", "html": "\u003ch3>Kiểm tra nghĩa thay vì đếm từ trùng\u003c/h3>\n\u003cp>Giữ nguyên người thực hiện, hành động, thời gian, mức độ và điều kiện. Đáp án đúng có thể dùng từ khác hoàn toàn; đáp án sai có thể lặp đúng nhiều từ vừa nghe.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 84–85 yêu cầu học sinh chọn ba hiện vật mình thấy thú vị. Câu hỏi 1 có đáp án Artifacts that draw his attention. Các cách nói interesting, catch your eyes và draw attention cùng hướng đến sự chú ý cá nhân, không có nghĩa phải chọn hiện vật nổi tiếng nhất.\u003c/p>\n\u003ch3>Nhóm chuyển đổi nên học\u003c/h3>\n\u003cp>Put off → postpone; cannot afford → not have enough money; free of charge → at no cost; run out of → have none left. Đây là các cặp theo ngữ cảnh, không phải mọi tình huống đều thay được nguyên xi.\u003c/p>\n\u003ch3>Tự kiểm tra\u003c/h3>\n\u003cp>Viết lại bằng tiếng Việt một câu vừa nghe. So đáp án với bản nghĩa đó. Đặc biệt kiểm tra can với must, some với all, cheaper với cheapest và may với certainly.\u003c/p>"}, {"id": "8", "title": "Suy luận có bằng chứng", "source": "L3.1 · PDF 91–102", "html": "\u003ch3>Suy luận là bước nối ngắn\u003c/h3>\n\u003cp>Dùng thông tin được nói để chọn kết luận hợp lý nhất. Đừng thêm câu chuyện từ kinh nghiệm riêng. Most likely và probably thường báo hiệu câu hỏi này.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 93 nhắc assignments, absent from your class, homework assignment và quiz. Đại từ your cùng vai trò giao bài giúp xác định người đàn ông là giáo viên. Chỉ nghe class chưa đủ, vì cả học sinh và giáo viên đều ở lớp.\u003c/p>\n\u003ch3>Nguyên tắc kiểm tra\u003c/h3>\n\u003cp>Viết hai bằng chứng và một kết luận. Nếu không chỉ được bằng chứng, hãy giảm độ chắc chắn. Loại đáp án tuyệt đối khi lời nói chỉ thể hiện khả năng hoặc dự định.\u003c/p>\n\u003ch3>Bước lên B2\u003c/h3>\n\u003cp>Tập suy ra quan điểm từ cả nội dung và giọng điệu với audio người thật. Bài tổng hợp dùng giọng máy ở đây tập suy luận từ ngôn ngữ; không đánh giá đầy đủ khả năng nhận biết sắc thái tự nhiên.\u003c/p>"}, {"id": "9", "title": "Hiểu chức năng của một câu nói", "source": "L3.2 · PDF 103–110", "html": "\u003ch3>Nhận diện\u003c/h3>\n\u003cp>Why does the speaker say và What does the speaker mean when hỏi chức năng của một câu trong tình huống. Bạn cần nghe câu trước, câu được trích và phản hồi sau đó.\u003c/p>\n\u003ch3>Ví dụ trong sách\u003c/h3>\n\u003cp>PDF 105 có người bạn nói một cuốn sách có thể làm người kia thay đổi suy nghĩ sau khi nghe người kia không thích đọc. Câu đó có mục đích thuyết phục bạn thử đọc, không phải nói người bạn đang hiểu sai một dữ kiện.\u003c/p>\n\u003ch3>Trình tự phân tích\u003c/h3>\n\u003cp>Xác định điều người nói đang phản hồi, rồi gắn một chức năng: clarify, correct, suggest, reassure, disagree hoặc persuade. Cuối cùng kiểm tra phản ứng tiếp theo có phù hợp không.\u003c/p>\n\u003ch3>Giới hạn khi luyện bằng giọng tổng hợp\u003c/h3>\n\u003cp>Máy có thể không thể hiện mỉa mai, ngạc nhiên hay do dự giống người thật. Không kết luận thái độ chỉ từ cao độ do máy tạo. Với bài luyện ở đây, đáp án dựa trên ngôn ngữ và tình huống được nêu rõ.\u003c/p>"}, {"id": "10", "title": "Chữa bài bằng transcript và nghe lại", "source": "Quy trình tự học bổ sung", "html": "\u003ch3>Vòng luyện năm bước\u003c/h3>\n\u003cp>Lần 1: nghe không transcript, trả lời và đánh dấu độ chắc chắn. Lần 2: nghe lại đoạn khó để tìm bằng chứng. Bước 3: xem transcript, xác định chỗ hiểu sai. Bước 4: nghe và đọc nhẩm theo từng cụm. Bước 5: đóng chữ, nghe lại để kiểm tra.\u003c/p>\n\u003ch3>Phân loại lỗi\u003c/h3>\n\u003cp>Âm: biết chữ nhưng không nhận ra khi nghe. Từ: chưa biết nghĩa. Ngữ pháp: nghe đủ từ nhưng hiểu sai quan hệ. Câu hỏi: nhầm người, thời gian, NOT hoặc mức độ. Tập trung: bị kẹt ở câu trước và bỏ lỡ đoạn sau.\u003c/p>\n\u003ch3>Chép chính tả và nhại lại\u003c/h3>\n\u003cp>Với đoạn 10–20 giây, nghe hai hoặc ba lần rồi viết lại. Đối chiếu từ bị thiếu, nghe lại, sau đó đọc theo mẫu. Ưu tiên rõ nghĩa và nhịp cụm từ; không cố bắt chước một giọng lạ bằng mọi giá.\u003c/p>\n\u003ch3>Đo tiến bộ\u003c/h3>\n\u003cp>So lần nghe đầu của các bài mới có độ dài và độ khó tương đương. Ghi cả số lần nghe, việc có xem transcript và các điều kiện luyện. Điểm cao hơn khi làm lại cùng bài chủ yếu cho biết đã học bài đó tốt hơn.\u003c/p>"}], "groups": [{"id": 0, "title": "Thay đổi lịch"}, {"id": 1, "title": "Giờ và thời hạn"}, {"id": 2, "title": "Tiền và mua sắm"}, {"id": 3, "title": "Giao thông"}, {"id": 4, "title": "Sân bay và chuyến bay"}, {"id": 5, "title": "Khách sạn và đặt chỗ"}, {"id": 6, "title": "Thư viện"}, {"id": 7, "title": "Học tập"}, {"id": 8, "title": "Dự án và trình bày"}, {"id": 9, "title": "Công việc"}, {"id": 10, "title": "Điện thoại và lời nhắn"}, {"id": 11, "title": "Hướng dẫn và quy tắc"}, {"id": 12, "title": "Điều kiện và giới hạn"}, {"id": 13, "title": "Đề nghị và ưu tiên"}, {"id": 14, "title": "Sửa thông tin và đối lập"}, {"id": 15, "title": "Tổ chức bài nói"}, {"id": 16, "title": "Khảo sát và bằng chứng"}, {"id": 17, "title": "Cộng đồng và tình nguyện"}, {"id": 18, "title": "Bảo tàng và phỏng vấn"}, {"id": 19, "title": "Thái độ và chức năng"}], "vocab": [{"id": 0, "group": 0, "term": "put off", "meaning": "hoãn lại", "paraphrase": "postpone"}, {"id": 1, "group": 0, "term": "bring forward", "meaning": "chuyển sớm hơn", "paraphrase": "move to an earlier time"}, {"id": 2, "group": 0, "term": "be delayed", "meaning": "bị chậm", "paraphrase": "happen later than planned"}, {"id": 3, "group": 0, "term": "as planned", "meaning": "như dự kiến", "paraphrase": "as arranged"}, {"id": 4, "group": 0, "term": "instead of", "meaning": "thay vì", "paraphrase": "in place of"}, {"id": 5, "group": 0, "term": "from now on", "meaning": "từ bây giờ trở đi", "paraphrase": "starting now"}, {"id": 6, "group": 0, "term": "at short notice", "meaning": "gấp với ít thời gian báo trước", "paraphrase": "with little warning"}, {"id": 7, "group": 0, "term": "confirm the time", "meaning": "xác nhận giờ", "paraphrase": "check the agreed time"}, {"id": 8, "group": 0, "term": "reschedule an appointment", "meaning": "đổi lịch hẹn", "paraphrase": "arrange a different time"}, {"id": 9, "group": 0, "term": "cancel a booking", "meaning": "hủy đặt chỗ", "paraphrase": "end a reservation"}, {"id": 10, "group": 1, "term": "quarter past seven", "meaning": "bảy giờ mười lăm", "paraphrase": "seven fifteen"}, {"id": 11, "group": 1, "term": "quarter to eight", "meaning": "tám giờ kém mười lăm", "paraphrase": "seven forty-five"}, {"id": 12, "group": 1, "term": "half past ten", "meaning": "mười giờ rưỡi", "paraphrase": "ten thirty"}, {"id": 13, "group": 1, "term": "no later than", "meaning": "không muộn hơn", "paraphrase": "by this time at the latest"}, {"id": 14, "group": 1, "term": "by Friday", "meaning": "chậm nhất vào thứ Sáu", "paraphrase": "on or before Friday"}, {"id": 15, "group": 1, "term": "until Friday", "meaning": "cho đến thứ Sáu", "paraphrase": "continuing up to Friday"}, {"id": 16, "group": 1, "term": "within two days", "meaning": "trong vòng hai ngày", "paraphrase": "before two days have passed"}, {"id": 17, "group": 1, "term": "in advance", "meaning": "trước thời điểm diễn ra", "paraphrase": "beforehand"}, {"id": 18, "group": 1, "term": "at the latest", "meaning": "muộn nhất", "paraphrase": "not after that time"}, {"id": 19, "group": 1, "term": "once a fortnight", "meaning": "hai tuần một lần", "paraphrase": "every two weeks"}, {"id": 20, "group": 2, "term": "free of charge", "meaning": "miễn phí", "paraphrase": "at no cost"}, {"id": 21, "group": 2, "term": "an extra charge", "meaning": "phụ phí", "paraphrase": "an additional fee"}, {"id": 22, "group": 2, "term": "get
