estions": [{"text": "What time will the workshop begin?", "options": ["9:00", "10:00", "10:30", "12:30"], "answer": 2, "type": "Thời gian", "explanation": "Đáp án C. “begin at half past ten instead of ten” chốt giờ mới là 10:30. 9:00 là giờ mở cửa; 10:00 là lịch cũ; 12:30 là giờ kết thúc.", "track": "S01", "id": 1}]}, {"id": "S02", "part": 1, "title": "Collecting a reserved book", "turns": [{"speaker": "N", "text": "Your reserved book is now available. Please collect it from the information desk on the ground floor. We normally keep reservations upstairs, but that desk is closed for repairs this week. Bring your library card. If you cannot come by Friday, call us and we can keep the book until Monday. Please do not use the return box to collect reservations."}], "questions": [{"text": "Where should the listener collect the book?", "options": ["At the ground-floor information desk", "At the upstairs reservation desk", "From the return box", "At the repair office"], "answer": 0, "type": "Địa điểm", "explanation": "Đáp án A. Nơi lấy sách hiện tại là “the information desk on the ground floor”. Upstairs là vị trí thường lệ đang đóng; return box không dùng để lấy; không có repair office để nhận sách.", "track": "S02", "id": 2}]}, {"id": "S03", "part": 1, "title": "A refund at the cinema", "turns": [{"speaker": "N", "text": "We are sorry that tonight’s film has been cancelled because the projector is not working. You can exchange your ticket for another screening or request a refund. To receive a refund, take your ticket to the box office before Sunday. Please do not call the café about this issue. Tickets bought online can be refunded through the website instead."}], "questions": [{"text": "What should a customer with a paper ticket do to get a refund?", "options": ["Wait for the café to call", "Return on Sunday evening", "Buy another ticket online", "Take the ticket to the box office before Sunday"], "answer": 3, "type": "Yêu cầu", "explanation": "Đáp án D. “take your ticket to the box office before Sunday” là hành động được yêu cầu. Website áp dụng cho vé mua online; café không xử lý; Sunday evening đã không đáp ứng before Sunday.", "track": "S03", "id": 3}]}, {"id": "S04", "part": 1, "title": "A message for new volunteers", "turns": [{"speaker": "N", "text": "Welcome to the community garden. Before you start, please put your bags in the small shed near the entrance. Gardening gloves are provided, but you should bring your own drinking water. Today we will show you where the tools are kept and explain the watering schedule. You do not need any gardening experience. We will work in pairs so nobody has to begin alone."}], "questions": [{"text": "What is the main purpose of the message?", "options": ["To sell gardening equipment", "To introduce new volunteers to the garden", "To announce that the garden is closing", "To recruit professional gardeners only"], "answer": 1, "type": "Mục đích", "explanation": "Đáp án B. Lời chào và các hướng dẫn ban đầu dành cho tình nguyện viên mới. Có công cụ nhưng không bán; không đóng vườn; câu “do not need any gardening experience” loại D.", "track": "S04", "id": 4}]}, {"id": "S05", "part": 1, "title": "A revised delivery", "turns": [{"speaker": "N", "text": "Hello, this is West Street Furniture. We were due to deliver your desk on Tuesday morning. Unfortunately, the road outside your building will be closed that day. We have arranged delivery for Wednesday afternoon at no extra charge. The desk is ready and undamaged. Please call us today if the new time is inconvenient; you do not need to order the item again."}], "questions": [{"text": "Why has the delivery been changed?", "options": ["The desk has been damaged", "The customer ordered the wrong item", "The road will be closed", "An additional payment is required"], "answer": 2, "type": "Lý do", "explanation": "Đáp án C. Đường bị đóng là nguyên nhân nêu trực tiếp. Người nói xác nhận bàn nguyên vẹn, không thêm phí và không cần đặt lại; các ý đó loại A, B, D.", "track": "S05", "id": 5}]}, {"id": "S06", "part": 1, "title": "A ticket at the museum", "turns": [{"speaker": "N", "text": "Your ticket includes entry to the permanent collection and the temporary photography exhibition. The guided tour is also included, but you need to reserve a place because groups are small. The workshop upstairs costs an extra five pounds. Photography is allowed without flash in the permanent collection, but it is not permitted in the temporary exhibition. Please ask at reception if you need directions."}], "questions": [{"text": "Which activity requires an additional payment?", "options": ["Visiting the permanent collection", "Taking the guided tour", "Seeing the photography exhibition", "Joining the upstairs workshop"], "answer": 3, "type": "Chi tiết", "explanation": "Đáp án D. “costs an extra five pounds” chỉ workshop. Ba lựa chọn còn lại đều nằm trong vé; tour cần đặt chỗ nhưng không đồng nghĩa thêm phí.", "track": "S06", "id": 6}]}, {"id": "S07", "part": 1, "title": "An announcement before departure", "turns": [{"speaker": "N", "text": "Good evening, passengers. We are ready to depart, but please keep the aisle clear while the remaining bags are placed in the overhead compartments. Your seat belts must remain fastened until the sign is turned off. If you need assistance, press the button above your seat and a member of the cabin crew will come to you. Thank you for your cooperation."}], "questions": [{"text": "Where is this announcement most likely being made?", "options": ["On an aircraft", "In a bookshop", "At a railway ticket office", "In a hotel lobby"], "answer": 0, "type": "Bối cảnh", "explanation": "Đáp án A. Overhead compartments, seat belts và cabin crew cùng tạo bối cảnh máy bay. Chỉ từ passengers thì chưa đủ vì tàu cũng có hành khách; các dấu hiệu kết hợp mới quyết định.", "track": "S07", "id": 7}]}, {"id": "S08", "part": 1, "title": "Choosing an evening class", "turns": [{"speaker": "N", "text": "Our beginner Spanish course starts next month. Classes take place on Monday evenings, not Wednesdays as stated in the old leaflet. You can try the first session without paying, but please book a place in advance. After that, there is a fee for the remaining seven sessions. The course is for adults who have never studied Spanish, so previous experience is not necessary."}], "questions": [{"text": "What must people do before attending the free first session?", "options": ["Pay for all eight sessions", "Reserve a place", "Show evidence of previous study", "Attend a Wednesday class"], "answer": 1, "type": "Điều kiện", "explanation": "Đáp án B. Buổi đầu miễn phí nhưng “please book a place in advance”. Không cần học trước hay đóng tiền ngay; Wednesday là thông tin cũ đã sửa.", "track": "S08", "id": 8}]}, {"id": "C01", "part": 2, "title": "Planning a student project", "turns": [{"speaker": "A", "text": "Hi, Maya. Have you decided how we should present our research project? I was thinking about interviewing students on video. It would be more interesting than a long written report."}, {"speaker": "B", "text": "Video could work, but remember the deadline is next Friday. We have only collected half of the survey responses. Editing interviews might take more time than we have."}, {"speaker": "A", "text": "That is true. We could borrow a camera from the media office, though. The equipment would not cost anything."}, {"speaker": "B", "text": "The cost is not my main concern. It is the editing. Neither of us has done it before. Why not make a short slide presentation and use a few anonymous quotes from the survey?"}, {"speaker": "A", "text": "Good idea. We can show the main findings on three charts. Shall we include all twenty survey questions?"}, {"speaker": "B", "text": "I would focus on the questions about study spaces. That is what our tutor asked us to investigate. We can put the other results in an appendix, in case anyone asks."}, {"speaker": "A", "text": "All right. I will prepare the charts. Could you write a short explanation of how we collected the data?"}, {"speaker": "B", "text": "Yes, but we should mention that most respondents are from our department. Our results may not represent every student on campus."}, {"speaker": "A", "text": "I nearly forgot that. We should be careful about saying students prefer quiet rooms if we only asked people we know."}, {"speaker": "B", "text": "Exactly. Let us meet in the library on Wednesday afternoon to put everything together. Then we will have Thursday to practise."}, {"speaker": "A", "text": "Wednesday is fine. I will send you the charts by Tuesday evening, so you can check them first."}], "questions": [{"text": "What are the students mainly discussing?", "options": ["How to buy video equipment", "How to prepare their research presentation", "Why the library should close earlier", "Which department they should join"], "answer": 1, "type": "Ý chính", "explanation": "Đáp án B. Hai người chọn hình thức trình bày, chia việc và hẹn hoàn thiện. Camera và thư viện là chi tiết phụ; không nói đóng thư viện hay chọn ngành.", "track": "C01", "id": 9}, {"text": "Why does Maya prefer not to make a video?", "options": ["The camera is too expensive", "Their tutor has forbidden interviews", "They have no survey responses", "Editing may take too much time"], "answer": 3, "type": "Lý do", "explanation": "Đáp án D. Maya nói “It is the editing” và cả hai chưa biết dựng. Camera miễn phí nên A sai; không có lệnh cấm; đã thu được một nửa phản hồi nên C sai.", "track": "C01", "id": 10}, {"text": "What limitation should they mention?", "options": ["Most respondents are from their own department", "All the survey questions were unclear", "The results were collected several years ago", "Nobody answered the questions about study spaces"], "answer": 0, "type": "Chi tiết", "explanation": "Đáp án A. Mẫu trả lời tập trung ở khoa của họ nên không đại diện toàn trường. Những hạn chế ở B, C, D không được nêu.", "track": "C01", "id": 11}, {"text": "What will the first student do by Tuesday evening?", "options": ["Finish the entire written report", "Interview the tutor", "Send Maya the charts", "Reserve a camera"], "answer": 2, "type": "Hành động", "explanation": "Đáp án C. Lời cuối chốt gửi charts vào Tuesday evening. Gặp ở thư viện là Wednesday, còn phương án video đã bỏ; không có cam kết hoàn thành toàn bộ report.", "track": "C01", "id": 12}]}, {"id": "C02", "part": 2, "title": "Choosing a travel option", "turns": [{"speaker": "A", "text": "Hello. I am going to Northbridge for a training course next week, and I need some help choosing a ticket. I used to take the six fifteen train, but I heard the timetable has changed."}, {"speaker": "B", "text": "It has. The direct train now leaves at six forty and arrives at eight ten. There is also a cheaper service at six twenty, but you have to change trains at Hillford."}, {"speaker": "A", "text": "My course begins at nine, so either arrival time could work. How long is the connection at Hillford?"}, {"speaker": "B", "text": "Only seven minutes. It is usually enough, but if the first train is late you could miss the connection. The next one would get you to Northbridge after nine."}, {"speaker": "A", "text": "I would rather avoid that risk on the first day. I will take the direct train. Can I come back on any train in the evening?"}, {"speaker": "B", "text": "With the flexible return ticket, yes. The cheaper fixed ticket is valid only on the train you select. It cannot be used on a later service if your course finishes late."}, {"speaker": "A", "text": "The tutor has not confirmed the finishing time, so the flexible return sounds better. Is there a discount for booking online?"}, {"speaker": "B", "text": "The price is the same online and at the station. You can, however, save money if you travel after nine in the morning. That would not help you on this journey."}, {"speaker": "A", "text": "No, it would make me late. One direct ticket with a flexible return, please. Do I need to print it?"}, {"speaker": "B", "text": "You can show the ticket on your phone. Keep the screen bright enough for the scanner, and make sure the phone is charged. If you prefer, we can print a copy here."}, {"speaker": "A", "text": "I will use my phone and bring a charger. Thank you for explaining the options."}], "questions": [{"text": "Why does the traveller choose the direct train?", "options": ["It is the earliest train", "It includes a free meal", "It avoids the risk of a missed connection", "It arrives after the course starts"], "answer": 2, "type": "Lý do", "explanation": "Đáp án C. Người đi muốn tránh nguy cơ lỡ nối chuyến. Tàu rẻ hơn rời sớm hơn nên A sai; không có bữa ăn; tàu trực tiếp đến 8:10 trước giờ học 9:00.", "track": "C02", "id": 13}, {"text": "What time does the direct train now leave?", "options": ["6:40", "6:15", "6:20", "8:10"], "answer": 0, "type": "Thông tin sửa", "explanation": "Đáp án A. “now leaves at six forty”. 6:15 là lịch cũ, 6:20 là chuyến phải đổi tàu, 8:10 là giờ đến.", "track": "C02", "id": 14}, {"text": "Why is a flexible return ticket useful for the traveller?", "options": ["It always costs less online", "It guarantees a seat on every service", "It removes the need for a morning ticket", "The course finishing time is uncertain"], "answer": 3, "type": "Suy luận", "explanation": "Đáp án D. Chưa xác nhận giờ kết thúc nên cần linh hoạt chọn chuyến về. Giá online bằng tại ga; không nêu bảo đảm ghế; vẫn phải mua vé đi.", "track": "C02", "id": 15}, {"text": "What does the staff member advise about using a phone ticket?", "options": ["Keep the screen dark", "Make sure the phone is charged", "Send the ticket to the tutor", "Leave the phone at the station"], "answer": 1, "type": "Hướng dẫn", "explanation": "Đáp án B. Người bán nhắc pin và độ sáng màn hình. A trái với lời nhắc; C, D không xuất hiện.", "track": "C02", "id": 16}]}, {"id": "C03", "part": 2, "title": "Organising a community event", "turns": [{"speaker": "A", "text": "Thanks for meeting me, Daniel. We need to finalise the repair event for Saturday. I have booked the community hall from ten until four, but I am worried that people will expect us to fix everything they bring."}, {"speaker": "B", "text": "Then we should make the limits clear. Our volunteers can help with simple clothing repairs and basic bicycle checks. We cannot accept large electrical appliances. We do not have the right equipment or qualified staff for those."}, {"speaker": "A", "text": "Agreed. I will update the poster. Should we ask everyone to book a time?"}, {"speaker": "B", "text": "For bicycles, yes. Each check can take half an hour, and we only have two volunteers. For clothing repairs, people can arrive without an appointment, as long as they are prepared to wait."}, {"speaker": "A", "text": "Some visitors may just want to watch and learn. Is that all right?"}, {"speaker": "B", "text": "Of course. In fact, we want people to take part rather than leave an item and disappear. The purpose is to share skills, not to operate a free repair shop."}, {"speaker": "A", "text": "That is a useful distinction. What about tools and materials?"}, {"speaker": "B", "text": "We have the tools, but visitors should bring any special materials, such as a matching zip or unusual buttons. We will have ordinary thread and a few basic supplies."}, {"speaker": "A", "text": "I was going to advertise free repairs. Perhaps that would create the wrong impression."}, {"speaker": "B", "text": "Yes. You could say, learn to repair everyday items with volunteer support. We also need to explain that we cannot guarantee that every item will be repaired."}, {"speaker": "A", "text": "I will use that wording. Shall we collect feedback at the end?"}, {"speaker": "B", "text": "Definitely. Ask visitors what they learned and whether they would try a similar repair at home. Counting repaired items alone would miss the main benefit."}], "questions": [{"text": "What is the main aim of the event?", "options": ["To sell new household items", "To repair every electrical appliance", "To raise money for a bicycle shop", "To help people learn repair skills"], "answer": 3, "type": "Mục đích", "explanation": "Đáp án D. Daniel nói “share skills” và khuyến khích người tham gia tự làm. Không phải bán hàng, gây quỹ hay nhận mọi đồ điện.", "track": "C03", "id": 17}, {"text": "Who needs to book a time?", "options": ["Anyone who wants to watch", "People bringing bicycles for checks", "All visitors with clothing repairs", "Volunteers bringing thread"], "answer": 1, "type": "Điều kiện", "explanation": "Đáp án B. Bicycle checks cần đặt giờ vì ít tình nguyện viên và mất thời gian. Clothing có thể đến không hẹn nếu chấp nhận chờ; không yêu cầu cả người xem đặt lịch.", "track": "C03", "id": 18}, {"text": "What should visitors bring when necessary?", "options": ["All the basic tools", "Their own chairs", "Special materials needed for their items", "A qualification in repair work"], "answer": 2, "type": "Chi tiết", "explanation": "Đáp án C. Ví dụ được nêu là matching zip hoặc unusual buttons. Ban tổ chức có tools và đồ cơ bản; không yêu cầu chứng chỉ.", "track": "C03", "id": 19}, {"text": "Why does Daniel say that counting repaired items would miss the main benefit?", "options": ["Learning is an important outcome even when an item is not repaired", "The organisers have no way to count visitors", "Only new items can be counted", "The event is mainly for professional mechanics"], "answer": 0, "type": "Chức năng", "explanation": "Đáp án A. Câu trước hỏi người đến học được gì và có thể thử ở nhà không; tiêu chí lợi ích là học kỹ năng. B và C không có bằng chứng; D trái với tính cộng đồng.", "track": "C03", "id": 20}]}, {"id": "T01", "part": 3, "title": "Reviewing a bicycle loan scheme", "turns": [{"speaker": "N", "text": "Today I would like to describe a small bicycle loan scheme at our college and explain what we learned from its first term. The aim was to help students make short local journeys without buying a bicycle immediately. We began with twenty second-hand bicycles, all checked by a qualified mechanic. Students could borrow one for up to a week after completing a short safety briefing."}, {"speaker": "N", "text": "Before the scheme opened, we expected first-year students to be the main users. In fact, many borrowers were students in their final year whose own bicycles were being repaired. This did not mean the scheme had failed. It meant that our original picture of the users was too narrow. The survey helped us notice a need we had not planned for."}, {"speaker": "N", "text": "A second finding concerned where the bicycles were collected. At first, collection was available only from the sports centre, which was far from most teaching buildings. We moved the collection desk to the main entrance twice a week. Borrowing increased after that change, although we cannot say that location was the only cause. The weather also became warmer during the same period."}, {"speaker": "N", "text": "There were problems. Some bicycles were returned late, which disappointed people waiting for them. We introduced reminder messages the day before a bicycle was due back. We did not immediately introduce fines because we wanted to understand why returns were late. Several students said they had misunderstood whether the return date included the weekend."}, {"speaker": "N", "text": "For the next term, the college plans to keep clearer return instructions and improve the booking page. We are considering more bicycles, but buying twice as many will not automatically make the service twice as useful. We first need to know which sizes are most often requested and how much maintenance each bicycle needs. A good scheme depends on reliable equipment and convenient access, not simply a large total number of bicycles."}], "questions": [{"text": "What is the main purpose of the talk?", "options": ["To review a college bicycle loan scheme", "To teach professional bicycle repair", "To advertise new bicycles for sale", "To explain how to pass a driving test"], "answer": 0, "type": "Mục đích", "explanation": "Đáp án A. Bài mô tả chương trình, kết quả, vấn đề và bước tiếp theo. B, C, D là hoạt động khác; mechanic chỉ là người kiểm tra xe.", "track": "T01", "id": 21}, {"text": "Which users were more common than originally expected?", "options": ["Only first-year students", "Local shop owners", "Final-year students whose bicycles were being repaired", "Members of the public with no college connection"], "answer": 2, "type": "Chi tiết", "explanation": "Đáp án C. Dự kiến first-year, thực tế nhiều final-year có xe đang sửa. Phân biệt dự đoán trước với phát hiện sau.", "track": "T01", "id": 22}, {"text": "What change was made to the collection arrangements?", "options": ["The desk was permanently closed", "Collection was offered at the main entrance twice a week", "Students had to collect bicycles outside the city", "All collections moved to the weekend"], "answer": 1, "type": "Chi tiết", "explanation": "Đáp án B. “main entrance twice a week” là thay đổi cụ thể. Không đóng dịch vụ, chuyển ra ngoài thành phố hay chỉ mở cuối tuần.", "track": "T01", "id": 23}, {"text": "Why is warmer weather mentioned?", "options": ["To show that the bicycles were unsafe in summer", "To explain why reminders were cancelled", "To prove that location had no effect", "To identify another possible reason for increased borrowing"], "answer": 3, "type": "Chức năng", "explanation": "Đáp án D. Thời tiết ấm lên là yếu tố khác có thể góp phần tăng lượt mượn. Không thể khẳng định riêng việc dời địa điểm gây ra toàn bộ thay đổi; cũng không chứng minh địa điểm vô tác dụng.", "track": "T01", "id": 24}, {"text": "What will the college do before substantially expanding the fleet?", "options": ["Remove all return instructions", "Check demand for different sizes and maintenance needs", "Stop collecting feedback", "Guarantee every student a new bicycle"], "answer": 1, "type": "Suy luận", "explanation": "Đáp án B. Người nói ưu tiên biết sizes và maintenance trước khi tăng số lượng. A, C ngược kế hoạch; D không được hứa.", "track": "T01", "id": 25}]}, {"id": "T02", "part": 3, "title": "Recording local memories", "turns": [{"speaker": "N", "text": "Our local museum has begun a project to record memories of the old market. The market building has changed several times, and photographs tell only part of its story. We want to hear from people who worked there, shopped there or lived nearby. Their experiences can help us understand how the place was used in everyday life."}, {"speaker": "N", "text": "Volunteers sometimes think that an interview should collect as many dates as possible. Dates matter, but a useful interview also asks how things felt and why people made particular choices. Instead of asking only when a shop opened, you might ask what a normal morning in the market was like. That question gives the speaker room to describe sounds, routines and relationships."}, {"speaker": "N", "text": "However, a vivid memory is not automatically an accurate record of every detail. Two people may remember the same event differently. We do not erase one account simply because it conflicts with another. We keep the accounts separate and, where possible, compare them with photographs, newspapers or business records. Differences can tell us something about perspective as well as about mistakes."}, {"speaker": "N", "text": "Permission is another essential part of the project. Before recording, volunteers explain where the interview may be used. A participant can agree to a recording for the archive but refuse permission for it to appear on the public website. Those are different choices. If someone does not want to answer a question, the interviewer moves on rather than putting pressure on them."}, {"speaker": "N", "text": "For the first exhibition, we will use short extracts with clear labels about who is speaking and when the interview was made. The full recordings will be stored securely in the museum archive, subject to the permissions given. Our aim is not to produce one perfect story that everyone must accept. It is to let visitors encounter several experiences of the same place and to think carefully about how we learn from memories."}], "questions": [{"text": "Why is the museum collecting oral accounts?", "options": ["To replace every photograph with a recording", "To discover the exact price of all market goods", "To learn about everyday experiences not fully shown in photographs", "To persuade people to reopen all the old shops"], "answer": 2, "type": "Lý do", "explanation": "Đáp án C. Photographs chỉ kể một phần; trải nghiệm giúp hiểu đời sống ở chợ. Không loại bỏ ảnh hay khôi phục mọi cửa hàng.", "track": "T02", "id": 26}, {"text": "Which question best follows the speaker’s advice?", "options": ["What was a normal morning in the market like?", "Can you list every date without explanation?", "Will you give the same answer as the last participant?", "Why are all your memories certainly correct?"], "answer": 0, "type": "Áp dụng", "explanation": "Đáp án A. Câu mở mời mô tả routines và cảm giác. B quá hẹp, C áp đặt câu trả lời, D mặc định ký ức luôn đúng.", "track": "T02", "id": 27}, {"text": "How are conflicting accounts handled?", "options": ["The less dramatic account is deleted", "Both accounts are replaced by a fictional story", "Only the newest account is accepted", "They are kept separately and compared with other evidence"], "answer": 3, "type": "Chi tiết", "explanation": "Đáp án D. Giữ riêng và đối chiếu photographs, newspapers, records. Không xóa chỉ vì mâu thuẫn; không bịa câu chuyện thay thế.", "track": "T02", "id": 28}, {"text": "What can a participant choose to permit?", "options": ["Public use is compulsory whenever recording is allowed", "Archiving the recording without publishing it online", "Only a recording that contains no personal memories", "Any use decided by the interviewer later"], "answer": 1, "type": "Điều kiện", "explanation": "Đáp án B. Đồng ý lưu archive không đồng nghĩa cho đăng website. A và D phủ nhận quyền lựa chọn; C không có trong đoạn.", "track": "T02", "id": 29}, {"text": "What does the final paragraph suggest about the exhibition?", "options": ["It will present different perspectives on the market", "It will prove that every memory is false", "It will use only business records", "It will hide when the interviews were recorded"], "answer": 0, "type": "Suy luận", "explanation": "Đáp án A. Mục tiêu là “several experiences of the same place”. Không phủ nhận mọi ký ức, không chỉ dùng hồ sơ kinh doanh, và có nhãn thời điểm ghi âm.", "track": "T02", "id": 30}]}, {"id": "T03", "part": 3, "title": "Evaluating a community survey", "turns": [{"speaker": "N", "text": "Suppose a neighbourhood centre wants to introduce evening classes. It sends a questionnaire to people on its email list and receives one hundred responses. Seventy respondents choose photography, so the organiser concludes that photography is the most popular subject in the whole neighbourhood. Is that conclusion justified? We need to look more closely at who had a chance to answer."}, {"speaker": "N", "text": "The email list contains people who have already attended activities at the centre. It may exclude residents who are interested but have never registered, and people who do not regularly use email. Seventy out of a hundred is a clear result for the respondents, but it does not necessarily describe everyone who lives nearby. The first lesson is to identify the group your data actually represents."}, {"speaker": "N", "text": "Question wording can also influence responses. Imagine asking, would you like an enjoyable photography class or an ordinary computer class? The adjectives make the options unequal. A fairer question would describe both subjects neutrally and give similar information about times, prices and equipment. Otherwise, people may be responding to the description rather than the subject itself."}, {"speaker": "N", "text": "Practical constraints still matter after preferences have been collected. Photography may be popular, but the centre might not have suitable equipment or an available teacher. Rather than promising a full course immediately, it could run a small introductory session and collect feedback. Attendance would show whether people who expressed interest were able to come at the proposed time."}, {"speaker": "N", "text": "Finally, the centre should explain what it has learned and what remains uncertain. It can say that photography was the most selected option among those who answered the email survey. That statement is less dramatic than saying everyone wants photography, but it is more precise. Good decisions do not require pretending that a small survey answers every question. They require combining the responses with practical information and being willing to revise the plan when new evidence appears."}], "questions": [{"text": "What is the talk mainly about?", "options": ["How to become a professional photographer", "How to interpret a survey when planning classes", "Why community centres should stop using email", "Why all surveys produce identical results"], "answer": 1, "type": "Ý chính", "explanation": "Đáp án B. Bài bàn mẫu người trả lời, cách hỏi, giới hạn thực tế và cách dùng kết quả. Photography là ví dụ, không phải chủ đề dạy nghề ảnh.", "track": "T03", "id": 31}, {"text": "Who might be missing from the survey?", "options": ["People already on the centre’s email list", "Every person who likes photography", "All previous participants", "Residents who have never registered with the centre"], "answer": 3, "type": "Chi tiết", "explanation": "Đáp án D. Email list chỉ gồm người đã tham gia nên có thể bỏ sót cư dân chưa đăng ký. A là nhóm được liên hệ; B, C nói quá mức.", "track": "T03", "id": 32}, {"text": "Why does the speaker mention the words enjoyable and ordinary?", "options": ["To show that computer courses are always boring", "To recommend colourful advertising", "To illustrate how wording can favour one option", "To explain why no equipment is needed"], "answer": 2, "type": "Chức năng", "explanation": "Đáp án C. Hai tính từ đánh giá không cân xứng làm lựa chọn thiên lệch. Người nói đề nghị mô tả trung tính, không kết luận lớp máy tính chán.", "track": "T03", "id": 33}, {"text": "What is suggested before promising a full course?", "options": ["Run a small introductory session", "Purchase equipment for every resident", "Ignore the teacher’s availability", "Close all existing classes"], "answer": 0, "type": "Đề nghị", "explanation": "Đáp án A. Introductory session giúp kiểm tra khả năng tham gia thực tế và nhận phản hồi. Không có các hành động cực đoan B, C, D.", "track": "T03", "id": 34}, {"text": "Which conclusion is best supported by the survey?", "options": ["Everyone in the neighbourhood wants photography", "Photography was the most selected subject among the respondents", "A photography course will certainly make a profit", "Email users never attend evening classes"], "answer": 1, "type": "Suy luận", "explanation": "Đáp án B. Kết luận phải giới hạn ở respondents. A mở rộng thành mọi người; C dự đoán chắc chắn lợi nhuận không có dữ kiện; D trái nội dung.", "track": "T03", "id": 35}]}], "questions": [{"text": "What time will the workshop begin?", "options": ["9:00", "10:00", "10:30", "12:30"], "answer": 2, "type": "Thời gian", "explanation": "Đáp án C. “begin at half past ten instead of ten” chốt giờ mới là 10:30. 9:00 là giờ mở cửa; 10:00 là lịch cũ; 12:30 là giờ kết thúc.", "track": "S01", "id": 1}, {"text": "Where should the listener collect the book?", "options": ["At the ground-floor information desk", "At the upstairs reservation desk", "From the return box", "At the repair office"], "answer": 0, "type": "Địa điểm", "explanation": "Đáp án A. Nơi lấy sách hiện tại là “the information desk on the ground floor”. Upstairs là vị trí thường lệ đang đóng; function chrome(){const known=Object.values(state.vocab).filter(x=>x==='known').length;const items=[['home','grid','Tổng quan',''],['guide','book','Cẩm nang','10'],['listen','headphones','Luyện Listening','35'],['dictation','pen','Chép chính tả','12'],['vocab','cards','Cụm từ','200'],['plan','calendar','Lộ trình',''],['notebook','folder','Sổ học tập',''],['sources','external','Nguồn nghe',''],['audio','volume','Audio sách','']];$('#sidebar').innerHTML=`<a href="#/home" class="brand"><span class="brand-icon">${icon('headphones')}</span>Listening<br>Studio</a><p class="brand-sub">VSTEP · MỤC TIÊU B1</p><div class="nav-label">NGHE MỖI NGÀY</div><nav class="nav-list">${items.map(([id,ic,label,n])=>`<a href="#/${id}" class="nav-item ${id===view?'active':''}" ${id===view?'aria-current="page"':''}>${icon(ic)}${label}${n?`<span class="nav-count">${n}</span>`:''}</a>`).join('')}</nav><div class="sidebar-foot"><div class="goal-mini"><h4>Kho cụm từ của mình</h4><p>${known} / 200 cụm đã nhớ</p><div class="progress"><span style="width:${known/2}%"></span></div></div><div class="side-user"><span class="avatar">AH</span><div><strong>Góc học của bạn</strong><small>Tự lưu trên trình duyệt</small></div></div></div>`;const title=items.find(x=>x[0]===view)?.[2]||'Tổng quan';$('#topbar').innerHTML=`<div class="breadcrumb"><button class="icon-button mobile-menu" data-action="menu" aria-label="Mở menu" aria-expanded="false">${icon('menu')}</button><span>GÓC TỰ HỌC</span> / <strong>${title}</strong></div><div class="top-actions"><button class="save-badge" id="save-status" data-action="settings"><i class="status-dot"></i>${storageOK?'Tự lưu':'Lưu trong phiên'}</button><button class="icon-button" data-action="voiceSettings" aria-label="Giọng đọc và tốc độ">${icon('volume')}</button><button class="icon-button" data-action="theme" aria-label="Đổi giao diện sáng tối">${icon(state.theme==='dark'?'sun':'moon')}</button><button class="icon-button" data-action="settings" aria-label="Tùy chọn và sao lưu">${icon('settings')}</button></div>`;document.body.dataset.theme=state.theme;document.title=title+' · Listening Studio';}
function head(t,d,e,action=''){return `<div class="page-head"><div><div class="eyebrow">${e}</div><h1>${t}</h1><p>${d}</p></div>${action}</div>`;}
function home(){const known=Object.values(state.vocab).filter(x=>x==='known').length,done=Object.values(state.dict).filter(x=>x.done&&x.correct).length;return head('Hôm nay, nghe rõ hơn một chút.','Nghe có mục tiêu, tìm bằng chứng và nhận ra điều mình vừa bỏ lỡ.','LISTENING STUDIO',btn(icon('volume')+' Thử giọng đọc','voiceSettings','','secondary'))+`<div class="welcome"><section class="card hero listening-hero"><div class="eyebrow">CÙNG BẠN XÂY NỀN B1</div><h2>Nghe từng cụm.<br>Hiểu cả câu chuyện.</h2><p>Cẩm nang theo sách, bài nghe tự biên soạn và một nơi lưu lại tiến bộ của mình.</p>${routeLink('Bắt đầu nghe '+icon('arrow'),'listen')}<div class="sound-art" aria-hidden="true">${Array.from({length:11},(_,i)=>`<i style="--h:${[28,55,90,130,75,165,110,62,145,85,36][i]}px"></i>`).join('')}</div></section><section class="card session-card"><div class="eyebrow">MỘT BUỔI HỌC NHỎ</div><h2 style="margin:14px 0">15 phút để bắt nhịp</h2><p>Nghe một đoạn ngắn, trả lời trước khi xem transcript rồi chữa đúng chỗ mình nghe sai.</p><div class="ring-row">${ring(Math.round(done/12*100),`${done}/12`,'CÂU CHÉP ĐÚNG')}<p>Chép ngắn<br>Nghe kỹ<br>Nhớ lâu hơn</p></div>${routeLink('Thử chép một câu','dictation','secondary')}</section></div><div class="stats">${[[known,' / 200','Cụm từ đã nhớ','cards'],[state.lessons.length,' / 10','Chuyên đề đã học','book'],[state.attempts.length,'','Lượt luyện đã nộp','headphones']].map(([n,s,l,ic])=>`<div class="card stat"><span class="stat-icon">${icon(ic)}</span><div><b>${n}<small>${s}</small></b><p>${l}</p></div></div>`).join('')}</div>${state.session?`<section class="card session-resume"><div class="flex between wrap"><div><h3>Bạn có bài đang làm</h3><p>Đã chọn ${Object.keys(state.session.answers).length}/${state.session.range.length} câu${state.session.mode==='timed'?' · Đồng hồ 40 phút đang chạy':''}</p></div>${routeLink('Tiếp tục bài nghe','listen')}</div></section>`:''}<div class="dashboard-lower"><section class="card"><div class="card-top"><h2>Học theo một vòng rõ ràng</h2><span class="chip">MỖI NGÀY</span></div>${[['01','Học một kỹ thuật','Bám các nhóm L1, L2, L3 trong sách.','guide/3'],['02','Nghe và chọn đáp án','Giữ transcript đóng ở lần nghe đầu.','listen'],['03','Chữa lại điều chưa nghe ra','Đọc bằng chứng rồi nghe lại từng câu.','notebook']].map(([n,t,s,r])=>`<div class="learning-step"><span class="step-number">${n}</span><div class="step-body"><h4>${t}</h4><p>${s}</p></div><a href="#/${r}" class="icon-button" aria-label="${t}">${icon('arrow')}</a></div>`).join('')}</section><aside class="card tip-box"><div class="eyebrow">MẸO NGHE CHI TIẾT</div><blockquote>Con số đầu tiên có thể chỉ là kế hoạch cũ.</blockquote><p>Chú ý actually, instead và has been moved. Sau đó gắn thông tin mới với đúng người và sự việc được hỏi.</p>${routeLink('Học cách nghe thông tin sửa','guide/3','text')}</aside></div><div class="subsection">${notice('Bài luyện dùng <strong>giọng đọc tổng hợp của thiết bị</strong>, không phải audio gốc của sách hay bài thi thật. Hãy chọn giọng tiếng Anh trước khi bắt đầu; mở <a href="#/audio">Audio sách</a> để dùng MP3 từ thư mục của bạn, hoặc luyện thêm trong Nguồn nghe.')}</div>`;}
function guide(){const id=Math.max(1,Math.min(10,Number(viewId)||state.lastGuide));if(state.lastGuide!==id){state.lastGuide=id;save();}const c=DATA.chapters[id-1];const ls=id===3?DATA.lessons.slice(0,3):id===4?DATA.lessons.slice(3):null;return head('Cẩm nang Listening','Chọn đúng phần cần học, mở chuyên đề và ghi lại điều mình cần nhớ.','ĐỌC ĐỂ NGHE CÓ PHƯƠNG PHÁP')+`<select data-select="guide" class="guide-jump" aria-label="Chọn phần cẩm nang">${DATA.chapters.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.id}. ${esc(x.title)}</option>`).join('')}</select><div class="guide-layout"><nav class="guide-nav">${DATA.chapters.map(x=>`<a href="#/guide/${x.id}" class="${x.id===id?'active':''}"><span>${String(x.id).padStart(2,'0')}</span>${esc(x.title)}</a>`).join('')}</nav><article class="card guide-article"><div class="eyebrow">PHẦN ${id} / 10</div><h2 style="margin:15px 0 22px">${esc(c.title)}</h2>${ls?ls.map((l,i)=>`<details class="lesson" ${i===0?'open':''}><summary><span class="lesson-index">${l.id}</span>${esc(l.title)}${state.lessons.includes(l.id)?icon('check'):''}</summary><div class="lesson-inner"><p class="source-note">${esc(l.source)}</p><div class="prose">${l.html}</div><label class="lesson-mark"><input type="checkbox" data-lesson="${l.id}" ${state.lessons.includes(l.id)?'checked':''}> Tôi đã học và hiểu chuyên đề này</label></div></details>`).join(''):`<div class="prose">${c.html}</div>`}<label class="note-label" for="chapter-note">Ghi chú cho phần này</label><textarea id="chapter-note" data-note="${id}" class="note-area" maxlength="30000" placeholder="Cụm mình nghe nhầm, bằng chứng và cách sửa…">${esc(state.notes[id]||'')}</textarea><p class="source-note">Tự lưu trong trình duyệt.</p><div class="flex between wrap" style="margin-top:20px">${id>1?routeLink('Phần trước','guide/'+(id-1),'secondary'):'<span></span>'}${id<10?routeLink('Phần tiếp','guide/'+(id+1),'secondary'):routeLink('Về tổng quan','home','secondary')}</div></article></div>`;}
function currentWords(){let list=filterVocab(DATA.vocab,state,filters);if(deck)list.sort((a,b)=>deck.indexOf(a.id)-deck.indexOf(b.id));return list;}
function vocab(){const list=currentWords();cardIndex=Math.min(Math.max(0,cardIndex),Math.max(0,list.length-1));const w=list[cardIndex];const top=head('Nghe được cả một cụm.','200 cụm từ theo 20 chủ đề. Nghe trước, thử nhớ nghĩa rồi lật thẻ.','KHO CỤM TỪ')+`<div class="toolbar"><label class="search-field">${icon('search')}<input type="search" id="word-search" value="${esc(filters.search)}" placeholder="Tìm cụm từ hoặc nghĩa…" aria-label="Tìm cụm từ"></label><select data-select="group" aria-label="Lọc chủ đề"><option value="all">Tất cả chủ đề</option>${DATA.groups.map(g=>`<option value="${g.id}" ${String(g.id)===String(filters.group)?'selected':''}>${esc(g.title)}</option>`).join('')}</select><select data-select="status" aria-label="Lọc trạng thái">${[['all','Tất cả trạng thái'],['learning','Cần ôn / chưa học'],['known','Đã nhớ'],['starred','Đã gắn sao']].map(([v,t])=>`<option value="${v}" ${filters.status===v?'selected':''}>${t}</option>`).join('')}</select><div class="segmented">${[['cards','Thẻ học'],['list','Danh sách']].map(([m,t])=>`<button data-action="vocabMode" data-mode="${m}" class="${vocabMode===m?'active':''}">${t}</button>`).join('')}</div></div>`;if(!w)return top+`<div class="empty"><h3>Không có cụm phù hợp</h3>${btn('Xóa bộ lọc','clearFilters','','secondary')}</div>`;if(vocabMode==='list')return top+`<div class="table-wrap"><table class="vocab-table"><thead><tr><th>Cụm từ</th><th>Nghĩa</th><th>Diễn giải</th><th>Học</th></tr></thead><tbody>${list.map(x=>`<tr><td lang="en">${esc(x.term)}</td><td>${esc(x.meaning)}</td><td lang="en">${esc(x.paraphrase)}</td><td>${btn(icon('volume'),'speakWord',`data-id="${x.id}" aria-label="Nghe ${esc(x.term)}"`,'secondary small')} ${btn(state.vocab[x.id]==='known'?'Đã nhớ':'Đánh dấu','markWord',`data-id="${x.id}"`,'soft small')}</td></tr>`).join('')}</tbody></table></div>`;
return top+`<div class="vocab-workspace"><section><div class="flashcard ${flipped?'is-flipped':''}"><div class="flash-inner"><div class="flash-face front" ${flipped?'inert aria-hidden="true"':''}><div class="flash-top"><span class="chip">${esc(DATA.groups[w.group].title)}</span><button class="star-button ${state.stars.includes(w.id)?'active':''}" data-action="star" data-id="${w.id}" aria-label="Đánh dấu sao" aria-pressed="${state.stars.includes(w.id)}">${icon('star')}</button></div><button class="flip-area" data-action="flip" aria-label="Lật thẻ để xem nghĩa" aria-pressed="false"><div class="meaning-label">THỬ NHỚ NGHĨA TRƯỚC</div><div class="flashword phrase" lang="en">${esc(w.term)}</div><div class="flip-hint">Nhấn để lật thẻ</div></button></div><div class="flash-face back" ${flipped?'':'inert aria-hidden="true"'}><div class="flash-top"><span class="chip">${esc(DATA.groups[w.group].title)}</span><button class="star-button ${state.stars.includes(w.id)?'active':''}" data-action="star" data-id="${w.id}" aria-label="Đánh dấu sao" aria-pressed="${state.stars.includes(w.id)}">${icon('star')}</button></div><button class="flip-area" data-action="flip" aria-label="Lật về mặt từ" aria-pressed="true"><div class="meaning-label">${esc(w.term)}</div><div class="flash-meaning">${esc(w.meaning)}</div><p class="muted" lang="en" style="margin:20px auto;max-width:450px">${esc(w.paraphrase)}</p><div class="flip-hint">Nhấn để trở về mặt từ</div></button></div></div></div><div class="flash-nav"><div class="flex">${btn(icon('back'),'prevWord',`aria-label="Thẻ trước" ${cardIndex===0?'disabled':''}`,'secondary small')}<span class="muted small">${cardIndex+1} / ${list.length}</span>${btn(icon('arrow'),'nextWord',`aria-label="Thẻ tiếp" ${cardIndex===list.length-1?'disabled':''}`,'secondary small')}</div>${btn(icon('volume')+' Nghe cụm','speakWord',`data-id="${w.id}"`,'secondary')}${btn('Trộn thẻ','shuffle','','secondary small')}</div><div class="flash-actions">${btn('Cần ôn lại','rateWord',`data-status="learning" ${flipped?'':'disabled'}`,'peach')}${btn('Mình đã nhớ','rateWord',`data-status="known" ${flipped?'':'disabled'}`)}</div></section><aside class="stack"><section class="card"><div class="eyebrow">HỌC BẰNG TAI</div><h3 style="margin:15px 0">Nghe rồi nói lại</h3><p class="muted small">Thử nhận ra cả cụm trước khi dịch. Cụm từ được tuyển chọn theo chủ đề học, không phải danh sách chính thức của VSTEP.</p><div style="margin-top:20px">${btn('Chọn giọng đọc','voiceSettings','','secondary')}</div></section><section class="card example-card"><h3>Từ đã nhớ</h3><p>${Object.values(state.vocab).filter(x=>x==='known').length} / 200</p><small>Đánh dấu lại “Cần ôn” nếu bạn chưa nhận ra cụm trong bài nghe mới.</small></section></aside></div>${miniAudioStatus()}`;}
function listen(){if(viewId==='result')return resultView();if(state.session)return sessionView();return head('Nghe. Chọn. Tìm bằng chứng.','14 đoạn tự biên soạn theo ba phần 8–12–15 câu.','THỰC HÀNH LISTENING',btn(icon('volume')+' Kiểm tra giọng đọc','voiceSettings','','secondary'))+`<section class="card test-banner"><div><span class="chip">BỘ LUYỆN TỰ BIÊN SOẠN</span><h2 style="margin:12px 0">Luyện tổng hợp 35 câu</h2><p>40 phút tự giới hạn · Có thể nghe lại · Ghi nhận lần mở transcript. Đây là buổi tự luyện, không mô phỏng đầy đủ tốc độ và điều kiện thi thật.</p></div>${btn('Bắt đầu 40 phút '+icon('arrow'),'startTimed')}</section>${notice('Thử giọng đọc trước khi bấm giờ. Khi cần nghe chậm và chữa kỹ, hãy chọn từng bài bên dưới để học không giới hạn thời gian.')}<div class="track-groups">${[1,2,3].map(part=>`<div class="card-top"><h2>Part ${part} · ${['Thông báo ngắn','Hội thoại','Bài nói và bài giảng'][part-1]}</h2><span class="chip gray">${[8,12,15][part-1]} CÂU</span></div><div class="test-grid">${DATA.tracks.filter(t=>t.part===part).map(t=>`<article class="card passage-card"><div class="flex between"><span class="chip">${t.id}</span><span class="small muted">Câu ${t.questions[0].id}${t.questions.length>1?'–'+t.questions.at(-1).id:''}</span></div><h3>${esc(t.title)}</h3><p>${t.questions.length} câu hỏi · Tự luyện không giới hạn giờ</p>${btn('Luyện bài này '+icon('arrow'),'startBlock',`data-id="${t.id}"`,'secondary')}</article>`).join('')}</div></div>`).join('')}`;}
function timerText(){const s=state.session;if(!s)return '';const sec=Math.max(0,Math.floor((s.mode==='timed'?s.end-Date.now():Date.now()-s.start)/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function player(track,allowTranscript=true){return `<section class="card audio-card"><div class="flex between"><span class="chip">${track.id} · GIỌNG TỔNG HỢP</span><span class="muted small">Part ${track.part}</span></div><div class="audio-wave" aria-hidden="true">${Array.from({length:31},(_,i)=>`<i style="height:${18+(i*29)%65}px"></i>`).join('')}</div><h2>${esc(track.title)}</h2><p class="muted small" style="margin-top:10px">Nghe trước khi mở transcript. Giọng đọc phụ thuộc thiết bị.</p><div class="audio-controls">${btn(icon('play')+' Phát từ đầu','playTrack',`data-id="${track.id}"`)}${btn(icon('pause'),'pauseSpeech','aria-label="Tạm dừng hoặc tiếp tục"','secondary')}${btn(icon('stop'),'stopSpeech','aria-label="Dừng giọng đọc"','secondary')}</div><div data-speech-status class="speech-status" role="status">${speechLabel()}</div><div class="flex between wrap"><label class="small">Tốc độ <select data-select="rate" aria-label="Tốc độ đọc">${[.7,.85,1,1.15].map(v=>`<option value="${v}" ${state.rate===v?'selected':''}>${v}×</option>`).join('')}</select></label>${btn('Giọng đọc','voiceSettings','','text')}</div>${state.session?`<p class="source-note" id="heard-count">Đã phát ${state.session.heard[track.id]||0} lượt trong bài làm này.</p>`:''}${allowTranscript?`<div style="margin-top:22px">${btn(state.session?.revealed.includes(track.id)?'Xem transcript':'Mở transcript để học','transcript',`data-id="${track.id}"`,'secondary')}</div>`:''}<p class="source-note">Nếu không có âm thanh, mở Giọng đọc để kiểm tra. Nút Phát từ đầu bắt đầu lại toàn bộ đoạn.</p></section>`;}
function questionHTML(q,s){return `<fieldset class="question" id="q-${q.id}"><legend lang="en">${q.id}. ${esc(q.text)}</legend><div class="q-meta"><span class="type">${q.type}</span><button class="flag ${s.flags.includes(q.id)?'active':''}" data-action="flag" data-id="${q.id}" aria-pressed="${s.flags.includes(q.id)}">${icon('flag')} ${s.flags.includes(q.id)?'Đã đánh dấu':'Xem lại'}</button></div>${q.options.map((x,i)=>`<label class="option ${s.answers[q.id]===i?'chosen':''}"><input type="radio" name="q${q.id}" data-question="${q.id}" value="${i}" ${s.answers[q.id]===i?'checked':''}><span lang="en"><b>${letters[i]}.</b> ${esc(x)}</span></label>`).join('')}</fieldset>`;}
function sessionView(){const s=state.session,t=T.get(s.track);return `<div class="session-head"><div><div class="eyebrow">${s.mode==='timed'?'TỔNG HỢP 35 CÂU':'TỰ LUYỆN TỪNG BÀI'}</div><h1 style="margin-top:10px">${esc(t.title)}</h1></div><div><div class="timer"><span id="timer-text">${timerText()}</span></div><small class="muted">${s.mode==='timed'?'Thời gian còn lại':'Thời gian đã học'}</small></div></div>${s.mode==='timed'?`<div class="passage-tabs">${s.tracks.map(id=>`<button data-action="track" data-id="${id}" class="${id===s.track?'active':''}">${id}</button>`).join('')}</div>`:''}<div class="question-rail"><div class="question-dots">${s.range.map(id=>`<button data-action="jumpQ" data-id="${id}" data-dot="${id}" class="${s.answers[id]!==undefined?'answered':''} ${s.flags.includes(id)?'flagged':''}" aria-label="Câu ${id}">${id}</button>`).join('')}</div><span id="answered-count" class="muted">Đã chọn ${Object.keys(s.answers).length}/${s.range.length} · Gạch cam là câu cần xem lại</span></div><div class="listening-layout">${player(t)}<section class="card listening-questions"><div class="card-top"><h3>Câu ${t.questions[0].id}${t.questions.length>1?'–'+t.questions.at(-1).id:''}</h3><span class="chip gray">CHỌN MỘT ĐÁP ÁN</span></div>${t.questions.map(q=>questionHTML(q,s)).join('')}</section></div><div class="session-foot"><span class="muted small">${s.mode==='timed'?'Đồng hồ tiếp tục khi đóng trang.':'Bài làm tự lưu. Có thể rời trang và học tiếp.'}</span>${s.tracks.indexOf(s.track)<s.tracks.length-1?btn('Đoạn tiếp '+icon('arrow'),'track',`data-id="${s.tracks[s.tracks.indexOf(s.track)+1]}"`,'secondary'):''}${btn('Nộp bài & xem kết quả','submit')}</div>`;}
function reviewQ(q,chosen,notebook=false){const ok=chosen===q.answer;return `<details class="review ${ok?'correct':'wrong'}"><summary>${icon(ok?'check':'x')}<span><strong>Câu ${q.id}.</strong> ${esc(q.text)}</span><span class="chip ${ok?'':'orange'}">${chosen===undefined?'Bỏ trống':ok?'Đúng':'Cần ôn'}</span></summary><div class="review-inner"><p class="ans-line ${ok?'':'bad'}"><strong>Bạn chọn:</strong> ${chosen===undefined?'Chưa trả lời':letters[chosen]+'. '+esc(q.options[chosen])}</p><p class="ans-line key"><strong>Đáp án:</strong> ${letters[q.answer]}. ${esc(q.options[q.answer])}</p><div class="explanation"><p>${esc(q.explanation)}</p></div><div class="wrong-tools">${btn('Nghe và xem transcript','reviewTrack',`data-id="${q.track}"`,'secondary small')}${notebook?btn(state.resolved.includes(q.id)?'Ôn lại câu này':'Đã hiểu lỗi này','resolve',`data-id="${q.id}"`,'soft small'):''}</div></div></details>`;}
function resultView(){const a=state.attempts.find(x=>x.id===state.lastAttempt);if(!a)return head('Chưa có kết quả','Hoàn thành một bài nghe để xem lời giải.','KẾT QUẢ')+routeLink('Chọn bài nghe','listen');const g=grade(a.range,a.answers),qs=a.range.map(id=>Q.get(id)).filter(q=>resultFilter!=='wrong'||a.answers[q.id]!==q.answer);return head('Nhìn lại buổi nghe của mình.','Mở từng câu để đối chiếu bằng chứng và nghe lại điều còn chưa rõ.','CHỮA BÀI',btn('Chọn bài tiếp theo','newListening','','secondary'))+`<section class="card result-hero">${ring(pct(g.correct,g.total),`${g.correct}/${g.total}`,'CÂU ĐÚNG')}<div><h2>${g.correct===g.total?'Bạn đã chọn đúng tất cả câu.':'Mỗi lỗi là một chỗ để luyện rõ hơn.'}</h2><p>${dateLabel(a.date)} · ${duration(a.ms)} · ${a.mode==='timed'?'Luyện tổng hợp':'Luyện từng bài'}</p><div class="flex wrap"><span class="chip">${g.correct} đúng</span><span class="chip orange">${g.wrong} sai</span><span class="chip gray">${g.unanswered} bỏ trống</span><span class="chip gray">${a.revealed.length?'Có mở transcript':'Không mở transcript trong bài'}</span></div><p class="source-note">Tổng lượt phát: ${Object.values(a.heard).reduce((x,y)=>x+y,0)}. Các lượt phát lại được tính riêng.</p></div></section>${notice('Điểm thô của đề tự biên soạn, <strong>không quy đổi thành B1/B2</strong>. Chất lượng giọng, tốc độ, số lần nghe và transcript đều ảnh hưởng kết quả.')}<div class="card-top" style="margin-top:25px"><h2>Lời giải từng câu</h2><div class="segmented">${[['all','Tất cả'],['wrong','Câu cần ôn']].map(([m,t])=>`<button data-action="resultFilter" data-mode="${m}" class="${resultFilter===m?'active':''}">${t}</button>`).join('')}</div></div>${qs.map(q=>reviewQ(q,a.answers[q.id])).join('')||'<div class="empty">Không có câu cần ôn trong bài này.</div>'}`;}
function transcriptHTML(t){return `<div class="transcript prose">${t.turns.map((x,i)=>`<p lang="en"><span class="transcript-turn">${x.speaker==='N'?String(i+1).padStart(2,'0'):x.speaker}</span>${esc(x.text)} <button class="sentence-play" data-action="playTurn" data-id="${t.id}" data-index="${i}" aria-label="Nghe lượt ${i+1}">${icon('volume')}</button></p>`).join('')}</div>`;}
function dictation(){const d=DATA.dictation[dictId],s=state.dict[d.id]||{text:'',done:false};return head('Nghe một câu, hiểu từng từ.','Nghe trước rồi gõ lại. Sau khi kiểm tra, nhìn cụm bị thiếu và nghe thêm một lượt.','CHÉP CHÍNH TẢ')+`<div class="dict-layout"><section class="card dict-card"><div class="flex between"><span class="chip">D${String(dictId+1).padStart(2,'0')} / 12</span><span class="small muted">GIỌNG TỔNG HỢP</span></div><div class="dict-symbol">${icon('headphones')}</div><h2>Thử nghe mà chưa nhìn chữ.</h2><div class="audio-controls">${btn(icon('play')+' Nghe câu','playDict')}${btn(icon('stop'),'stopSpeech','aria-label="Dừng đọc"','secondary')}${btn('Giọng & tốc độ','voiceSettings','','text')}</div><div data-speech-status class="speech-status">${speechLabel()}</div><label for="dict-input" class="note-label">Bạn nghe được gì?</label><textarea id="dict-input" class="note-area" maxlength="500" placeholder="Type what you hear…" lang="en">${esc(s.text)}</textarea><div style="margin-top:16px">${btn('Kiểm tra câu trả lời','checkDict')}${btn('Làm lại câu này','retryDict','','text')}</div>${s.done?`<div class="dict-feedback ${s.correct?'good':''}"><h3>${s.correct?'Khớp câu mẫu.':'Có điểm khác câu mẫu.'}</h3><p lang="en">${esc(d.text)}</p><p class="small"><strong>Cụm cần nghe:</strong> ${esc(d.chunk)} · ${esc(d.note)}</p>${!s.correct?'<p class="small">So từ bị thiếu hoặc thay đổi. Bộ kiểm tra bỏ qua hoa thường, dấu câu và một số cách viết tắt; đây không phải điểm VSTEP.</p>':''}</div>`:''}<div class="flex between" style="margin-top:25px">${btn('Câu trước','prevDict',dictId===0?'disabled':'','secondary')}${btn('Câu tiếp','nextDict',dictId===11?'disabled':'','secondary')}</div></section><aside class="card"><h3>12 câu ngắn</h3><div class="dict-grid">${DATA.dictation.map((x,i)=>`<button data-action="dictSelect" data-id="${i}" class="${i===dictId?'active':''} ${state.dict[i]?.done&&state.dict[i]?.correct?'done':''}" aria-label="Câu chép ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><p class="muted small">Nghe tối đa ba lần trước khi kiểm tra. Nếu vẫn chưa bắt được câu, chia nhỏ theo cụm và ôn lại sau.</p></aside></div>`;}
function plan(){return head('Sáu tuần, từng bước nghe vững.','Một lịch gợi ý để phân bổ việc học. Điều chỉnh theo nền tảng và thời gian của bạn.','LỘ TRÌNH')+`<div class="card"><div class="flex between"><h3>Việc đã hoàn thành</h3><span class="chip">${state.tasks.length} / 18</span></div><div class="progress" style="margin:18px 0"><span style="width:${pct(state.tasks.length,18)}%"></span></div><p class="muted small">Gợi ý 40–60 phút mỗi ngày, 5–6 ngày mỗi tuần. Không phải cam kết đạt B1 trong sáu tuần.</p></div><div class="weeks">${DATA.weeks.map((w,i)=>`<section class="card week"><div class="eyebrow">TUẦN 0${i+1}</div><h3>${w.name}</h3>${w.tasks.map((t,j)=>`<label class="task ${state.tasks.includes(`${i}-${j}`)?'done':''}"><input type="checkbox" data-task="${i}-${j}" ${state.tasks.includes(`${i}-${j}`)?'checked':''}><span>${t}</span></label>`).join('')}</section>`).join('')}</div>`;}
function errors(){const map=new Map();for(const a of state.attempts)for(const id of a.range)if(a.answers[id]!==Q.get(id).answer)map.set(id,{id,answer:a.answers[id]});return [...map.values()];}
function notebook(){const err=errors(),remaining=err.filter(x=>!state.resolved.includes(x.id));let body='';if(notebookTab==='errors')body=notice('Câu sai và bỏ trống tự được gom vào sổ. Mở lời giải, nghe lại, rồi đánh dấu khi đã hiểu cách sửa.')+`<h2 style="margin:24px 0 15px">Cần ôn lại · ${remaining.length}</h2>`+(remaining.map(x=>reviewQ(Q.get(x.id),x.answer,true)).join('')||'<div class="empty">Chưa có câu cần ôn. Hoàn thành một bài nghe để bắt đầu.</div>')+(err.length>remaining.length?`<details class="lesson"><summary>Các câu đã hiểu lỗi</summary><div class="lesson-inner">${err.filter(x=>state.resolved.includes(x.id)).map(x=>reviewQ(Q.get(x.id),x.answer,true)).join('')}</div></details>`:'');if(notebookTab==='notes')body=`<section class="card"><h2>Ghi chú tự học</h2><p class="muted small" style="margin:12px 0">Mã bài · bằng chứng · nhóm lỗi · cách sửa · ngày nghe lại</p><textarea data-note="general" class="note-area" style="min-height:250px" maxlength="50000" placeholder="Ví dụ: S01 — nhầm giờ cũ; nghe lại cụm instead of…">${esc(state.notes.general||'')}</textarea><p class="source-note">Tự lưu trong trình duyệt. Xuất JSON để sao lưu.</p></section>${Object.entries(state.notes).filter(([k,v])=>k!=='general'&&v.trim()).map(([k,v])=>`<section class="card subsection"><span class="eyebrow">GHI CHÚ CẨM NANG · ${k}</span><p class="journal-note">${esc(v)}</p>${routeLink('Mở phần này','guide/'+k,'text')}</section>`).join('')}`;if(notebookTab==='history')body=state.attempts.length?`<section class="card">${state.attempts.slice().reverse().map(a=>`<div class="history-row"><div><strong>${a.mode==='timed'?'Tổng hợp 35 câu':T.get(a.track).title}</strong><small>${dateLabel(a.date)} · ${duration(a.ms)} · ${a.revealed.length?'Có transcript':'Không mở transcript trong bài'}</small></div><div class="flex"><span class="score-pill">${a.score}/${a.range.length}</span>${btn(icon('arrow'),'history',`data-id="${esc(a.id)}" aria-label="Xem kết quả"`,'secondary small')}</div></div>`).join('')}</section>`:'<div class="empty">Chưa có bài đã nộp.</div>';return head('Sổ học tập của mình.','Giữ lại bằng chứng và cách sửa, không chỉ chữ cái đáp án.','CHỮA ĐỂ NGHE TỐT HƠN')+`<div class="segmented notebook-tabs">${[['errors','Câu cần ôn'],['notes','Ghi chú'],['history','Lịch sử']].map(([m,t])=>`<button data-action="notebookTab" data-mode="${m}" class="${m===notebookTab?'active':''}">${t}</button>`).join('')}</div>`+body;}
function sources(){const cards=[['AUDIO SÁCH','MP3 Vstep tổng hợp B1','Thư mục bạn cung cấp. Mở tệp để nghe trên Drive hoặc tải MP3 về và dùng mục Audio sách.',BOOK_AUDIO_URL],['HCMUE','Bài thi nghe có chấm tự động','Trang trường công bố liên kết bài nghe bậc 345. Kiểm tra âm thanh trên thiết bị trước khi làm.','https://vstep.hcmue.edu.vn/thi-thu-bac-345'],['BRITISH COUNCIL','Kho nghe B1 theo tình huống','Audio, hoạt động trước khi nghe và bài tập kiểm tra hiểu. Đây là luyện kỹ năng B1, không phải đề VSTEP.','https://learnenglish.britishcouncil.org/free-resources/listening/b1'],['BRITISH COUNCIL','An introduction to a lecture','Một bài nghe có transcript và hai hoạt động. Dùng để luyện bố cục bài giảng và các từ nối.','https://learnenglish.britishcouncil.org/free-resources/listening/b1/introduction-lecture'],['ULIS','Định dạng bài thi VSTEP','Nguồn đối chiếu 35 câu, ba phần và thời gian khoảng 40 phút.','https://vstep.vnu.edu.vn/test-format/']];return head('Luyện thêm với audio người thật.','Thay đổi giọng và tình huống để kiểm tra khả năng nghe trên bài mới.','NGUỒN NGHE')+`<div class="source-grid">${cards.map(([s,t,d,u])=>`<article class="card source-card"><div class="eyebrow">${s}</div><h3>${t}</h3><p>${d}</p><a class="btn secondary" href="${u}" target="_blank" rel="noopener noreferrer">Mở nguồn ${icon('external')}</a></article>`).join('')}</div>${notice('Các nguồn ngoài cần Internet. Nội dung tổng hợp được đối chiếu ngày 06/11/2026. Bộ luyện trong file này dùng giọng tổng hợp; hãy dùng audio người thật để luyện tốc độ, nối âm và sắc thái.')}<div class="subsection">${routeLink('Xem tài liệu đối chiếu','guide/10','text')}</div>`;}
function ownAudio(){return head('Nghe sách, học đúng bài.','Mở thư mục MP3, chọn đúng số tệp ghi trong sách rồi nghe và ghi chú.','AUDIO SÁCH')+`<section class="card book-audio-intro"><div><div class="eyebrow">MP3 VSTEP TỔNG HỢP B1</div><h2>Đã có đường dẫn audio của bạn.</h2><p>Nhấp đúp một tệp trên Drive để nghe. Hoặc chọn <strong>Download all</strong>, giải nén rồi mở MP3 ở trình phát bên dưới. Không cần plugin Google Drive.</p><a class="btn" href="${BOOK_AUDIO_URL}" target="_blank" rel="noopener noreferrer">Mở thư mục audio ${icon('external')}</a></div><div><h3>Tra nhanh trang PDF</h3><div class="audio-map">${BOOK_AUDIO_MAP.map(([n,page])=>`<div><strong>${n}.mp3</strong><span>Trang ${page}</span></div>`).join('')}</div><p class="source-note">Số trang PDF tính cả bìa. Tên tệp đầy đủ có dạng 01-VSTEP-BAC-3-B1.mp3. Đây là các mốc đã đối chiếu trên sách.</p></div></section><section class="card"><div class="flex between wrap"><div><h2>${localName?esc(localName):'Chọn một tệp để bắt đầu'}</h2><p class="muted small" style="margin-top:10px">Tệp chỉ được mở trên thiết bị, không tải lên. Cần chọn lại sau khi tải lại trang.</p></div>${btn(icon('folder')+' Chọn audio','chooseAudio','','secondary')}</div><audio id="own-player" controls ${localURL?'src="'+esc(localURL)+'"':''} style="width:100%;margin:28px 0"></audio><label class="small">Tốc độ phát <select data-select="localRate" aria-label="Tốc độ audio riêng"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label><label class="note-label" for="own-note">Ghi chú nghe</label><textarea id="own-note" class="note-area" data-note="general" placeholder="Tên tệp, thời điểm nghe chưa rõ, từ cần ôn…">${esc(state.notes.general||'')}</textarea></section><div class="subsection">${notice('Tệp audio riêng không tự có câu hỏi hoặc đáp án tương ứng. Với MP3 gốc của sách, mở đúng trang sách; với bản thu theo transcript của bộ này, chọn đúng mã bài S01–T03. Giữ audio gốc riêng vì bản sao JSON chỉ lưu tiến độ và ghi chú.')}</div>`;}
function miniAudioStatus(){return `<div data-speech-status class="speech-status" style="margin-top:15px">${speechLabel()}</div>`;}
function render(){const [part,id]=location.hash.replace(/^#\/?/,'').split('/');view=['home','guide','listen','dictation','vocab','plan','notebook','sources','audio'].includes(part)?part:'home';viewId=id||'';chrome();$('#content').innerHTML=({home,guide,listen,dictation,vocab,plan,notebook,sources,audio:ownAudio})[view]();updateSpeechStatus();}
function modal(title,body,buttons='',large=false){const d=$('#modal');d.className=large?'source-modal':'';d.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="closeModal" aria-label="Đóng hộp thoại">${icon('x')}</button></div>${body}${buttons?`<div class="dialog-actions">${buttons}</div>`:''}`;if(!d.open)d.showModal();}
function closeModal(){modalCallback=null;$('#modal').close();}
function confirm(title,body,label,callback){modalCallback=callback;modal(title,body,btn('Quay lại','closeModal','','secondary')+btn(label,'confirm'));}
function settings(){modal('Tiến độ & sao lưu',`<p>Tự lưu trên trình duyệt hiện tại. Không tự đồng bộ giữa thiết bị.</p><div class="settings-row"><div><h4>Sao lưu tiến độ</h4><p>Bài làm, từ đã nhớ, chép chính tả và ghi chú.</p></div>${btn('Xuất JSON','export','','secondary')}</div><div class="settings-row"><div><h4>Khôi phục bản sao</h4><p>Thay thế tiến độ hiện tại.</p></div>${btn('Nhập JSON','import','','secondary')}</div><div class="settings-row"><div><h4>Bắt đầu lại</h4><p>Xóa tiến độ trên trình duyệt này.</p></div>${btn('Xóa tiến độ','reset','','secondary')}</div>${notice('Đổi tên hoặc di chuyển file HTML có thể làm trình duyệt dùng vùng lưu khác. Hãy xuất bản sao trước. Audio riêng không nằm trong JSON.')}${!storageOK?notice('Trình duyệt không cho lưu lâu dài. Xuất JSON trước khi đóng trang.',true):''}`);}
function refreshVoices(){voices=typeof speechSynthesis!=='undefined'?speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)):[];if($('#voice-a'))fillVoiceOptions();}
function voiceOptions(selected){return `<option value="">Tự chọn giọng tiếng Anh</option>`+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===selected?'selected':''}>${esc(v.name)} · ${esc(v.lang)}${v.localService?' · trên máy':' · trực tuyến'}</option>`).join('');}
function fillVoiceOptions(){$('#voice-a').innerHTML=voiceOptions(state.voiceA);$('#voice-b').innerHTML=voiceOptions(state.voiceB);$('#voice-availability').textContent=voices.length?`${voices.length} giọng tiếng Anh khả dụng. Giọng “trên máy” có thể dùng khi ngoại tuyến; giọng trực tuyến cần mạng.`:'Chưa tìm thấy giọng tiếng Anh. Thử tải lại danh sách, chọn giọng hệ thống hoặc cài giọng English trên thiết bị. Nếu vẫn không phát, dùng audio người thật ở Nguồn nghe.';}
function voiceSettings(){refreshVoices();modal('Giọng đọc & tốc độ',`<p>Giọng tổng hợp để luyện nội dung và nhận diện cụm từ. Ngữ điệu có thể khác người thật.</p><p id="voice-availability" class="source-note"></p><div class="voice-fields"><label for="voice-a">Người A và lời dẫn</label><select id="voice-a" data-select="voiceA"></select><label for="voice-b">Người B trong hội thoại</label><select id="voice-b" data-select="voiceB"></select><label for="voice-rate">Tốc độ đọc</label><select id="voice-rate" data-select="rate">${[.7,.85,1,1.15].map(v=>`<option value="${v}" ${v===state.rate?'selected':''}>${v}×</option>`).join('')}</select></div><div class="audio-controls">${btn(icon('play')+' Thử giọng đọc','testVoice')}${btn('Tải lại giọng','refreshVoices','','secondary')}${btn('Dừng','stopSpeech','','secondary')}</div>${miniAudioStatus()}<p class="source-note">Mở file bằng Chrome hoặc Edge. Nếu không nghe: kiểm tra âm lượng, chọn giọng English khác và phát thử lại. Trên thiết bị chưa có giọng, phần đọc và bài tập vẫn dùng được; phần phát giọng cần bổ sung giọng tiếng Anh.</p>`);fillVoiceOptions();}

  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i].n===b[j].n?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<m||j<n){if(i<m&&j<n&&a[i].n===b[j].n){out.push({t:'ok',w:a[i].raw});i++;j++;}
    else if(j<n&&(i>=m||L[i][j+1]>=L[i+1][j])){out.push({t:'extra',w:b[j].raw});j++;}
    else{out.push({t:'miss',w:a[i].raw});i++;}}
  return {out,hit:L[0][0],total:m};
}
function enhanceDict(){
  if(view!=='dictation')return;
  const ctr=q('.dict-card .audio-controls');
  if(ctr&&!ctr.querySelector('[data-action=playDictSlow]')){
    const first=ctr.querySelector('[data-action=playDict]');
    first.insertAdjacentHTML('afterend',`<button class="btn secondary" data-action="playDictSlow" aria-label="Nghe chậm"><span class="turtle" aria-hidden="true">🐢</span> Chậm</button>`);
    ctr.insertAdjacentHTML('afterend','<p class="dict-plays" aria-live="polite"></p>');dictPlaysPaint();
  }
  const fb=q('.dict-feedback');const s=state.dict[dictId];
  if(fb&&s&&s.done&&!s.correct&&!fb.querySelector('.dict-diff')){
    const d=diff(s.text,DATA.dictation[dictId].text);
    const h=fb.querySelector('h3');if(h)h.textContent=`Đúng ${d.hit}/${d.total} từ của câu mẫu.`;
    fb.querySelector('h3').insertAdjacentHTML('afterend',`<div class="dict-diff" lang="en" aria-label="So sánh từng từ">${d.out.map(x=>`<span class="w ${x.t}" title="${x.t==='ok'?'Đúng':x.t==='miss'?'Thiếu hoặc nghe sai':'Bạn gõ thêm hoặc gõ sai'}">${esc(x.w)}</span>`).join(' ')}</div><div class="dict-legend"><span><i style="background:color-mix(in srgb,var(--green) 25%,transparent)"></i>Đúng</span><span><i style="background:#fff1b8"></i>Thiếu hoặc nghe sai</span><span><i style="background:#fde8ea"></i>Gõ thêm hoặc gõ sai</span></div>`);
  }
}

render=function(){closePop(false);if(preview&&(!state.session||state.session.track!==preview.id||!location.hash.includes('listen')))cancelPreview();_render();if(sessOnce())lockOnce();markAttempts();enhanceDict();};
if(sessOnce())lockOnce();markAttempts();enhanceDict();
})();
