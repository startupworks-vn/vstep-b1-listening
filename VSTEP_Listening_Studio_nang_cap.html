@keyframes card-in-next{from{opacity:0;transform:translateX(36px) scale(.98)}to{opacity:1;transform:none}}

<script id="study-data" type="application/json">{"chapters": [{"id": 1, "title": "Bắt đầu và cách dùng bộ tài liệu", "html": "\u003cp>Bộ này dành cho việc tự học VSTEP Listening với mục tiêu B1 và xây nền để tiến tới B2. Dùng Word để đọc hướng dẫn, ghi chú và chữa bài; dùng Listening Studio để nghe bài luyện tự biên soạn, trả lời, xem lời giải và lưu tiến độ.\u003c/p>\n\u003ch3>Kết luận khi dùng sách\u003c/h3>\n\u003cp>Sách có trình tự tốt từ nhận diện bối cảnh, chi tiết và bẫy âm đến hội thoại dài, paraphrase và suy luận. Tuy nhiên, chỉ đọc các trang câu hỏi không đủ để luyện nghe. Cần có đúng audio đi kèm hoặc dùng nguồn thay thế có transcript và đáp án. Học hết sách không tự động chứng minh đạt B1.\u003c/p>\n\u003ch3>Nội dung sách được đối chiếu\u003c/h3>\n\u003cp>Tài liệu luyện thi tổng hợp VSTEP bậc 3 B1 do Lê Huy Lâm, Trương Hoàng Duy, La Trường Duy và Huỳnh Thành Công biên soạn, Nhà xuất bản Tổng hợp Thành phố Hồ Chí Minh. Bản scan có 366 trang; phần Nghe nằm ở PDF 23–110. Số trang trong cẩm nang là vị trí trang PDF, tính bìa là trang 1.\u003c/p>\n\u003ch3>Audio trong bộ này\u003c/h3>\n\u003cp>Các bài tự biên soạn dùng giọng đọc tổng hợp của trình duyệt. Đây không phải MP3 gốc của sách và không phải bản thu của kỳ thi. Mở HTML bằng Chrome hoặc Edge, vào Giọng đọc, chọn giọng tiếng Anh rồi thử âm thanh. Số lượng và chất lượng giọng phụ thuộc thiết bị; giọng trực tuyến cần Internet. Nếu chưa có giọng, cài hoặc tải giọng tiếng Anh trong thiết bị, hay dùng mục Audio sách để mở MP3 từ thư mục bạn cung cấp. Audio sách đi cùng câu hỏi trong PDF; bộ 35 câu tự biên soạn có transcript và giọng đọc riêng.\u003c/p>\n\u003ch3>Học và đo kết quả\u003c/h3>\n\u003cp>Lần đầu hãy tự trả lời trước khi mở transcript. Khi chữa, được nghe lại, giảm tốc và đọc theo. Kết quả tự luyện là số câu đúng của bộ này; không quy đổi trực tiếp thành chứng nhận B1 hoặc B2. Việc đạt B1 còn phụ thuộc các kỹ năng khác và thang đánh giá của kỳ thi.\u003c/p>\n\u003ch3>Trình tự gợi ý\u003c/h3>\n\u003cp>Đọc phần 2 để hiểu cấu trúc; học mỗi ngày một chuyên đề ở phần 3–4; ôn 10 cụm từ ở phần 6; làm bài nghe ở phần 7; chỉ mở phần 8 sau khi làm. Phần 9 là kế hoạch sáu tuần, phần 10 dẫn đến nguồn nghe có người thật.\u003c/p>"}, {"id": 2, "title": "Cấu trúc bài thi và bản đồ sách", "html": "\u003ch3>Cấu trúc tham chiếu\u003c/h3>\n\u003cp>ULIS công bố Listening có khoảng 40 phút và 35 câu trắc nghiệm trong ba phần. Bài kiểm tra ý chính, chi tiết, ý kiến hoặc mục đích và suy luận. Bản đặc tả công khai của Trường Đại học Tài nguyên và Môi trường TP HCM mô tả cách chia 8–12–15 câu và nghe một lần. Hướng dẫn tại đơn vị thi và trên màn hình thi là căn cứ cho thao tác cụ thể. \u003ca class=\"source-ref\" href=\"#/guide/10\">[S1]\u003c/a> \u003ca class=\"source-ref\" href=\"#/guide/10\">[S2]\u003c/a>\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Phần\u003c/th>\u003cth>Nội dung\u003c/th>\u003cth>Câu hỏi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Part 1\u003c/td>\u003ctd>8 thông báo hoặc hướng dẫn ngắn\u003c/td>\u003ctd>1–8, mỗi đoạn một câu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Part 2\u003c/td>\u003ctd>3 hội thoại dài\u003c/td>\u003ctd>9–20, mỗi hội thoại bốn câu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Part 3\u003c/td>\u003ctd>3 bài nói hoặc bài giảng\u003c/td>\u003ctd>21–35, mỗi bài năm câu\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Một điểm cần cập nhật khi đọc sách\u003c/h3>\n\u003cp>Trang PDF 24 ghi khoảng 45 phút. Khi lập kế hoạch, dùng mốc khoảng 40 phút từ định dạng ULIS, và kiểm tra hướng dẫn của nơi dự thi. Không mặc định mọi hệ thống đều cho cùng số phút đọc trước hoặc chuyển đáp án. \u003ca class=\"source-ref\" href=\"#/guide/10\">[S1]\u003c/a>\u003c/p>\n\u003ch3>Bản đồ nội dung để mở sách đúng chỗ\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nội dung\u003c/th>\u003cth>Trang PDF\u003c/th>\u003cth>Cách dùng\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tổng quan và Part 1\u003c/td>\u003ctd>24–25\u003c/td>\u003ctd>Hiểu loại nhiệm vụ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L1.1 bối cảnh và câu hỏi tổng quan\u003c/td>\u003ctd>25–40\u003c/td>\u003ctd>Nhận diện nơi chốn, vai trò, mục đích, hành động\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L1.2 chi tiết\u003c/td>\u003ctd>41–50\u003c/td>\u003ctd>Thời gian, vị trí, lý do, yêu cầu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L1.3 bẫy từ\u003c/td>\u003ctd>51–60\u003c/td>\u003ctd>Gần âm, đồng âm, đa nghĩa, đối lập\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Part 2 và Part 3\u003c/td>\u003ctd>61\u003c/td>\u003ctd>Nhìn tổng thể đoạn dài\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L2.1 và L2.2\u003c/td>\u003ctd>62–77\u003c/td>\u003ctd>Ý chính và mục đích chính\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L2.3 và L2.4\u003c/td>\u003ctd>78–90\u003c/td>\u003ctd>Nghe theo cụm và paraphrase\u003c/td>\u003c/tr>\u003ctr>\u003ctd>L3.1 và L3.2\u003c/td>\u003ctd>91–110\u003c/td>\u003ctd>Suy luận và chức năng câu nói\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Đối chiếu tệp audio với sách\u003c/h3>\n\u003cp>Ví dụ: PDF 27 ghi 01.mp3; PDF 30 ghi 02.mp3; PDF 33 ghi 03.mp3; PDF 36 ghi 04.mp3; PDF 41–42 thuộc bài thời gian, PDF 43 ghi 09.mp3; PDF 63 ghi 20.mp3; PDF 69 ghi 29.mp3; PDF 79 ghi 40.mp3 và 41.mp3; PDF 98 ghi 58.mp3. Hãy dùng đúng tệp tương ứng, không ghép một audio cùng chủ đề nhưng khác nội dung vào đáp án của sách.\u003c/p>\n\u003ch3>Mở audio sách\u003c/h3>\n\u003cp>\u003ca href=\"https://drive.google.com/drive/folders/1P3svO0w855CHG3-blEh3M5Ns8OLs7dHk\" target=\"_blank\" rel=\"noopener noreferrer\">Thư mục MP3 Vstep tong hop B1 ↗\u003c/a> Thư mục bạn cung cấp mở được trên trình duyệt, có tệp đánh số như 01-VSTEP-BAC-3-B1.mp3. Nhấp đúp tệp để nghe, hoặc dùng Download all để tải về và giải nén. Trong HTML, vào Audio sách rồi Chọn audio để mở MP3 đã tải. Không cần plugin Google Drive. Đối chiếu số đầu tên tệp với số MP3 trên trang sách. Bộ 35 câu ở phần 7 là bài tự biên soạn có transcript riêng; không dùng audio sách làm đáp án cho bộ này.\u003c/p>"}, {"id": 3, "title": "Kỹ thuật cho đoạn nghe ngắn", "html": "\u003ch3>Nghe để nhận diện bối cảnh\u003c/h3>\n\u003cp>Nguồn học: L1.1 · PDF 25–35\u003c/p>\n\u003ch4>Mình cần nghe điều gì\u003c/h4>\n\u003cp>Câu hỏi Where are the speakers, Who is the speaker và What are they doing yêu cầu dựng lại tình huống. Ghi hai hoặc ba dấu hiệu thuộc cùng một bối cảnh, rồi kiểm tra vai trò của từng người. Một từ đơn lẻ chưa đủ để kết luận.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 27 nhắc reference book, check it out và stacks. Những dấu hiệu này cùng chỉ dịch vụ mượn sách, nên bối cảnh là thư viện. PDF 29 có captain, seat belt sign và overhead compartment: người phụ nữ đang hỗ trợ hành khách; cô ấy là tiếp viên, không phải phi công chỉ vì có từ captain.\u003c/p>\n\u003ch4>Cách tự luyện\u003c/h4>\n\u003cp>Che các lựa chọn, viết một nhãn bối cảnh bằng tiếng Việt sau lần nghe đầu. Nghe lại để tìm bằng chứng về vai trò. Chỉ sau đó mới đối chiếu đáp án. Nếu đọc lời thoại mới hiểu, ghi lỗi là nhận diện âm hoặc từ vựng, chưa xem như đã nghe được.\u003c/p>\n\u003ch4>Bẫy cần nhớ\u003c/h4>\n\u003cp>Phân biệt nơi người nói đang đứng với nơi họ định đến. Bài hỏi nghề của người nói không nhất thiết chọn nghề vừa được nhắc tên. Chú ý các động từ phục vụ, mời, trả tiền, hướng dẫn và các đại từ I, you, we.\u003c/p>\n\u003ch3>Nghe chi tiết và thông tin được sửa\u003c/h3>\n\u003cp>Nguồn học: L1.2 · PDF 41–50\u003c/p>\n\u003ch4>Trước khi nghe\u003c/h4>\n\u003cp>Đọc từ hỏi để biết cần một giờ, địa điểm, lý do hay hành động. Gạch từ giới hạn như now, tomorrow, before, after, NOT. Hình dung dạng đáp án, không đoán nội dung.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 41: cuộc họp dự kiến lúc 9 giờ nhưng hoãn hai giờ, nên giờ họp mới là 11 giờ. PDF 43: sách đang ở nhà; văn phòng, bảo tàng và thư viện có xuất hiện nhưng không trả lời câu hỏi về vị trí hiện tại.\u003c/p>\n\u003ch4>Quy trình ba cột\u003c/h4>\n\u003cp>Ghi rất ngắn: thông tin cũ → từ báo đổi → thông tin cuối. Ví dụ tự biên soạn: Tuesday → actually → Thursday. Đừng chốt ngay con số đầu tiên. Tuy nhiên, cũng đừng máy móc lấy con số cuối: phải gắn số với đúng đối tượng được hỏi.\u003c/p>\n\u003ch4>Lý do và yêu cầu\u003c/h4>\n\u003cp>Why hỏi nguyên nhân, không hỏi kết quả. What should listeners do hỏi hành động được yêu cầu, không phải mọi hành động có trong đoạn. PDF 47 dùng apply in person: ứng viên cần đến trực tiếp; nghe résumé không có nghĩa phải gửi hồ sơ bằng thư.\u003c/p>\n\u003ch3>Tránh bẫy từ giống âm và giống mặt chữ\u003c/h3>\n\u003cp>Nguồn học: L1.3 · PDF 51–60\u003c/p>\n\u003ch4>Ba lớp cần kiểm tra\u003c/h4>\n\u003cp>Âm có giống không, nghĩa có phù hợp không và cả câu có đúng tình huống không. Người thiết kế câu hỏi có thể dùng từ gần âm, đồng âm hoặc một nghĩa khác của cùng một từ.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 51 có rain trong bản tin thời tiết nhưng lựa chọn gây nhiễu dùng train. PDF 53 phân biệt sale với sail theo bối cảnh mua sắm. PDF 54 dùng coach trong chuyến bay với ngân sách sinh viên: ở đây là hạng phổ thông, không phải xe khách.\u003c/p>\n\u003ch4>Cách luyện nghe\u003c/h4>\n\u003cp>Nghe cả cụm ít nhất ba từ: on sale, a sailing boat, travel in coach. Đọc to cụm sau khi đã nghe mẫu. Khi gặp một cặp nghe giống nhau, dùng cú pháp và nghĩa để kiểm tra thay vì cố nghe một khác biệt không tồn tại trong từ đồng âm.\u003c/p>\n\u003ch4>Mục tiêu phù hợp\u003c/h4>\n\u003cp>Không cần học thuộc mọi homophone. Ưu tiên từ thời gian, giá tiền, địa điểm và hành động thường gặp. Với câu NOT, ghi rõ đang tìm điều bị cấm, điều không đúng hay điều không được nhắc.\u003c/p>"}, {"id": 4, "title": "Kỹ thuật cho hội thoại và bài nói dài", "html": "\u003ch3>Bắt ý chính của hội thoại và bài nói\u003c/h3>\n\u003cp>Nguồn học: L2.1 · PDF 62–70\u003c/p>\n\u003ch4>Câu hỏi điển hình\u003c/h4>\n\u003cp>What are the speakers mainly discussing và What is the talk mainly about đòi hỏi một ý bao quát. Câu mở đầu thường gợi chủ đề, nhưng kết luận phải phù hợp với toàn đoạn.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 63 có cuộc trò chuyện sau buổi học ở thư viện. Vấn đề trung tâm là sử dụng dịch vụ an ninh của trường để về ký túc xá an toàn; tiền học phí và thư viện chỉ là bối cảnh, không phải chủ đề chính.\u003c/p>\n\u003ch4>Ghi chú tối giản\u003c/h4>\n\u003cp>Dùng một dòng: chủ đề + vấn đề hoặc góc nhìn. Sau đó thêm tối đa ba nhánh ý. Ví dụ: campus transport → long wait → new evening route. Nếu ghi tất cả danh từ, bạn có thể bỏ lỡ mối quan hệ giữa chúng.\u003c/p>\n\u003ch4>Chọn đáp án\u003c/h4>\n\u003cp>Loại phương án quá hẹp chỉ nhắc một ví dụ, phương án quá rộng vượt nội dung và phương án chứa từ đúng nhưng quan hệ sai. Từ được lặp lại là dấu hiệu hữu ích, không phải quy tắc đảm bảo đáp án.\u003c/p>\n\u003ch3>Phân biệt chủ đề với mục đích\u003c/h3>\n\u003cp>Nguồn học: L2.2 · PDF 71–77\u003c/p>\n\u003ch4>Hai câu hỏi khác nhau\u003c/h4>\n\u003cp>Chủ đề là nói về điều gì. Mục đích là tại sao người đó nói: giải thích, đề nghị, thông báo thay đổi, xin giúp đỡ hay thuyết phục. Đáp án mục đích thường bắt đầu bằng to và động từ.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 71 nhắc chuyến đi Rạch Giá, nhưng người hỏi mở đầu để cho bạn mượn sách hướng dẫn du lịch. Chuyến đi là chủ đề dẫn nhập; cho mượn sách mới là mục đích của lời hỏi trong ngữ cảnh này.\u003c/p>\n\u003ch4>Quy trình\u003c/h4>\n\u003cp>Tìm vấn đề ban đầu, đề xuất hoặc yêu cầu chính, rồi cách cuộc trò chuyện kết thúc. Nếu câu hỏi hỏi mục đích của cả bài nói, đừng chỉ dùng mục đích của một câu nhỏ.\u003c/p>\n\u003ch4>Bài tập ngắn\u003c/h4>\n\u003cp>Nghe một lời nhắn và hoàn thành: Người nói gọi để ____. Dùng một động từ cụ thể như đổi lịch, xin xác nhận, hướng dẫn hoặc phàn nàn. Sau khi nghe lại, kiểm tra có bằng chứng cho động từ mình chọn không.\u003c/p>\n\u003ch3>Nghe theo cụm và ghi chú đúng trọng tâm\u003c/h3>\n\u003cp>Nguồn học: L2.3 · PDF 78–83\u003c/p>\n\u003ch4>Vì sao phải nghe theo cụm\u003c/h4>\n\u003cp>Trong lời nói liên tục, từ thường đi với nhau thành cụm có nghĩa. Biết từng từ nhưng không ghép được cụm vẫn có thể làm bạn chậm hơn audio. Sách giới thiệu listening in chunks ở PDF 78 và bài chia câu thành nhóm ở PDF 79.\u003c/p>\n\u003ch4>Cách làm\u003c/h4>\n\u003cp>Đọc câu hỏi trước để biết cần theo dõi cái gì. Khi nghe, ghi tên người, hành động, điều kiện và kết quả bằng từ khóa hoặc mũi tên. Ghi new card → cancel old first có ích hơn việc cố chép cả câu dài.\u003c/p>\n\u003ch4>Ví dụ tự biên soạn\u003c/h4>\n\u003cp>You can renew the loan / as long as / nobody else has reserved the book. Cụm as long as đặt điều kiện. Không được rút gọn thành ai cũng gia hạn được.\u003c/p>\n\u003ch4>Chữa lỗi\u003c/h4>\n\u003cp>Nghe lại một câu ngắn, chia cụm theo nghĩa, nhìn transcript kiểm tra, rồi nghe lại không nhìn. Chép chính tả 10–20 giây là đủ cho một vòng luyện; không cần chép cả bài dài mỗi ngày.\u003c/p>\n\u003ch3>Nhận ra cách diễn đạt tương đương\u003c/h3>\n\u003cp>Nguồn học: L2.4 · PDF 84–90\u003c/p>\n\u003ch4>Kiểm tra nghĩa thay vì đếm từ trùng\u003c/h4>\n\u003cp>Giữ nguyên người thực hiện, hành động, thời gian, mức độ và điều kiện. Đáp án đúng có thể dùng từ khác hoàn toàn; đáp án sai có thể lặp đúng nhiều từ vừa nghe.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 84–85 yêu cầu học sinh chọn ba hiện vật mình thấy thú vị. Câu hỏi 1 có đáp án Artifacts that draw his attention. Các cách nói interesting, catch your eyes và draw attention cùng hướng đến sự chú ý cá nhân, không có nghĩa phải chọn hiện vật nổi tiếng nhất.\u003c/p>\n\u003ch4>Nhóm chuyển đổi nên học\u003c/h4>\n\u003cp>Put off → postpone; cannot afford → not have enough money; free of charge → at no cost; run out of → have none left. Đây là các cặp theo ngữ cảnh, không phải mọi tình huống đều thay được nguyên xi.\u003c/p>\n\u003ch4>Tự kiểm tra\u003c/h4>\n\u003cp>Viết lại bằng tiếng Việt một câu vừa nghe. So đáp án với bản nghĩa đó. Đặc biệt kiểm tra can với must, some với all, cheaper với cheapest và may với certainly.\u003c/p>\n\u003ch3>Suy luận có bằng chứng\u003c/h3>\n\u003cp>Nguồn học: L3.1 · PDF 91–102\u003c/p>\n\u003ch4>Suy luận là bước nối ngắn\u003c/h4>\n\u003cp>Dùng thông tin được nói để chọn kết luận hợp lý nhất. Đừng thêm câu chuyện từ kinh nghiệm riêng. Most likely và probably thường báo hiệu câu hỏi này.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 93 nhắc assignments, absent from your class, homework assignment và quiz. Đại từ your cùng vai trò giao bài giúp xác định người đàn ông là giáo viên. Chỉ nghe class chưa đủ, vì cả học sinh và giáo viên đều ở lớp.\u003c/p>\n\u003ch4>Nguyên tắc kiểm tra\u003c/h4>\n\u003cp>Viết hai bằng chứng và một kết luận. Nếu không chỉ được bằng chứng, hãy giảm độ chắc chắn. Loại đáp án tuyệt đối khi lời nói chỉ thể hiện khả năng hoặc dự định.\u003c/p>\n\u003ch4>Bước lên B2\u003c/h4>\n\u003cp>Tập suy ra quan điểm từ cả nội dung và giọng điệu với audio người thật. Bài tổng hợp dùng giọng máy ở đây tập suy luận từ ngôn ngữ; không đánh giá đầy đủ khả năng nhận biết sắc thái tự nhiên.\u003c/p>\n\u003ch3>Hiểu chức năng của một câu nói\u003c/h3>\n\u003cp>Nguồn học: L3.2 · PDF 103–110\u003c/p>\n\u003ch4>Nhận diện\u003c/h4>\n\u003cp>Why does the speaker say và What does the speaker mean when hỏi chức năng của một câu trong tình huống. Bạn cần nghe câu trước, câu được trích và phản hồi sau đó.\u003c/p>\n\u003ch4>Ví dụ trong sách\u003c/h4>\n\u003cp>PDF 105 có người bạn nói một cuốn sách có thể làm người kia thay đổi suy nghĩ sau khi nghe người kia không thích đọc. Câu đó có mục đích thuyết phục bạn thử đọc, không phải nói người bạn đang hiểu sai một dữ kiện.\u003c/p>\n\u003ch4>Trình tự phân tích\u003c/h4>\n\u003cp>Xác định điều người nói đang phản hồi, rồi gắn một chức năng: clarify, correct, suggest, reassure, disagree hoặc persuade. Cuối cùng kiểm tra phản ứng tiếp theo có phù hợp không.\u003c/p>\n\u003ch4>Giới hạn khi luyện bằng giọng tổng hợp\u003c/h4>\n\u003cp>Máy có thể không thể hiện mỉa mai, ngạc nhiên hay do dự giống người thật. Không kết luận thái độ chỉ từ cao độ do máy tạo. Với bài luyện ở đây, đáp án dựa trên ngôn ngữ và tình huống được nêu rõ.\u003c/p>\n\u003ch3>Chữa bài bằng transcript và nghe lại\u003c/h3>\n\u003cp>Nguồn học: Quy trình tự học bổ sung\u003c/p>\n\u003ch4>Vòng luyện năm bước\u003c/h4>\n\u003cp>Lần 1: nghe không transcript, trả lời và đánh dấu độ chắc chắn. Lần 2: nghe lại đoạn khó để tìm bằng chứng. Bước 3: xem transcript, xác định chỗ hiểu sai. Bước 4: nghe và đọc nhẩm theo từng cụm. Bước 5: đóng chữ, nghe lại để kiểm tra.\u003c/p>\n\u003ch4>Phân loại lỗi\u003c/h4>\n\u003cp>Âm: biết chữ nhưng không nhận ra khi nghe. Từ: chưa biết nghĩa. Ngữ pháp: nghe đủ từ nhưng hiểu sai quan hệ. Câu hỏi: nhầm người, thời gian, NOT hoặc mức độ. Tập trung: bị kẹt ở câu trước và bỏ lỡ đoạn sau.\u003c/p>\n\u003ch4>Chép chính tả và nhại lại\u003c/h4>\n\u003cp>Với đoạn 10–20 giây, nghe hai hoặc ba lần rồi viết lại. Đối chiếu từ bị thiếu, nghe lại, sau đó đọc theo mẫu. Ưu tiên rõ nghĩa và nhịp cụm từ; không cố bắt chước một giọng lạ bằng mọi giá.\u003c/p>\n\u003ch4>Đo tiến bộ\u003c/h4>\n\u003cp>So lần nghe đầu của các bài mới có độ dài và độ khó tương đương. Ghi cả số lần nghe, việc có xem transcript và các điều kiện luyện. Điểm cao hơn khi làm lại cùng bài chủ yếu cho biết đã học bài đó tốt hơn.\u003c/p>"}, {"id": 5, "title": "Nghe âm và chép chính tả có mục tiêu", "html": "\u003ch3>Chữ quen nhưng nghe không ra\u003c/h3>\n\u003cp>Một từ có thể nhận ra khi đọc nhưng bị bỏ lỡ trong lời nói liên tục. Khi chữa, khoanh đúng cụm không nhận ra, nghe lại trong câu và kiểm tra xem lỗi nằm ở âm, từ vựng hay nhịp câu. Không cần phiên âm tiếng Việt, vì cách ghi đó dễ làm mất âm cuối và trọng âm.\u003c/p>\n\u003ch3>Số và thời gian\u003c/h3>\n\u003cp>Với thirteen và thirty, hãy nghe cả âm cuối lẫn trọng âm trong câu. Không dùng trọng âm như dấu hiệu duy nhất vì nó có thể đổi theo ý nhấn mạnh. Tập với cặp câu có ngữ cảnh: The class has thirteen students; The room holds thirty students. Với ngày giờ, ghi giờ ban đầu và giờ sau điều chỉnh.\u003c/p>\n\u003ch3>Từ nhỏ thay đổi nghĩa\u003c/h3>\n\u003cp>Not, only, until, unless, except, before và after rất dễ bị bỏ lỡ. Tự hỏi: điều kiện gì, loại trừ ai, trước hay sau mốc nào? We are open until six nghĩa là mở đến sáu giờ, không phải bắt đầu mở lúc sáu giờ.\u003c/p>\n\u003ch3>Cụm và nhịp\u003c/h3>\n\u003cp>Khi nghe could you, have to, going to, đừng đòi mọi âm phải rõ như một từ đứng riêng. Bài luyện giọng tổng hợp có thể phát âm rõ hơn người thật; dùng nguồn ở phần 10 để luyện lời nói tự nhiên và các giọng khác nhau.\u003c/p>\n\u003ch3>Bài chép chính tả trong HTML\u003c/h3>\n\u003cp>Có 12 câu ngắn để nghe và gõ lại. Bộ kiểm tra bỏ qua hoa thường, dấu câu và dấu gạch nối; có chấp nhận một số cặp viết tắt như cannot và can&#x27;t. So khớp dùng để nhận ra từ thiếu, không chấm khả năng nghe bằng một điểm VSTEP. Câu trả lời hiện sau khi bấm kiểm tra.\u003c/p>\n\u003ch3>Quy trình năm phút\u003c/h3>\n\u003cp>Nghe cả câu một lần. Nghe thêm tối đa hai lần để viết. Mở đáp án, đánh dấu từ sai, đọc theo cụm một lần. Đóng đáp án và nghe lại sau vài giờ. Với audio người thật, cắt đoạn ngắn để tránh biến chép chính tả thành bài kiểm tra trí nhớ dài.\u003c/p>"}, {"id": 6, "title": "Hai trăm cụm từ ưu tiên", "html": "\u003cp>Danh sách gồm các cụm được tuyển chọn theo chủ đề Listening trong sách và các tình huống luyện thêm. Đây là bộ học bổ sung, không phải danh sách từ vựng chính thức hay trích nguyên bộ từ của sách. Mỗi ngày học 10 mục: nghe, thử nói nghĩa, lật thẻ rồi tự đánh dấu. Phần diễn giải tiếng Anh gợi nghĩa trong ngữ cảnh, không phải các từ thay được cho nhau ở mọi câu.\u003c/p>\n\u003ch3>Thay đổi lịch\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cụm từ\u003c/th>\u003cth>Nghĩa trong ngữ cảnh\u003c/th>\u003cth>Diễn giải tiếng Anh\u003c/th>\u003c/tr>\u003c/thead>\u003ctbo
